<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treasure Trap: Voyage</title>
<style>
  :root {
    --sea-deep: #0a3d4d;
    --cream: #fff6e4;
    --gold: #ffd56a;
    --brass: #c9963a;
    --ink: #1a1008;
    --panel: rgba(8, 32, 44, 0.72);
    --edge: rgba(201, 150, 58, 0.65);
    --ok: #6dffb0;
    --bad: #ff7a6e;
    --chart: #0e4a5c;
    --display: "Trebuchet MS", "Segoe UI", "Avenir Next", sans-serif;
    --body: Nunito, "Segoe UI", "Trebuchet MS", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--sea-deep);
    color: var(--cream);
    font-family: var(--body);
    font-weight: 700;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  h1,h2,.display { font-family: var(--display); font-weight: 800; letter-spacing: .02em; }
  #stage { position: fixed; inset: 0; }
  canvas#sea { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud {
    position: relative; z-index: 2;
    height: 100%; width: min(480px, 100%);
    margin: 0 auto;
    padding: max(8px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 8px;
    pointer-events: none;
  }
  #hud > * { pointer-events: auto; }
  .top {
    display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center;
  }
  .brand h1 { margin: 0; font-size: 1.15rem; color: var(--gold); text-shadow: 0 2px 0 #1a0e04, 0 6px 16px rgba(0,0,0,.4); }
  .brand p { margin: 0; font-size: .7rem; opacity: .85; }
  .chest-timer {
    width: 58px; height: 58px; position: relative;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,.35));
  }
  .chest-timer img { width: 100%; height: 100%; object-fit: contain; }
  .chest-timer .sec {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: var(--display); font-size: 1.15rem;
    color: #fff; text-shadow: 0 2px 4px #000;
  }
  .ribbon {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px;
    scrollbar-width: none;
  }
  .ribbon::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 6px;
    padding: 5px 8px 5px 5px;
    background: var(--panel); border: 2px solid var(--edge); border-radius: 999px;
    backdrop-filter: blur(8px); font-size: .78rem; font-weight: 900;
  }
  .chip img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: #123; }
  .chip.you { box-shadow: 0 0 0 2px rgba(255,213,106,.35); border-color: var(--gold); }
  .chip.bot { opacity: .92; }
  .grow { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; }
  .panel {
    background: linear-gradient(180deg, rgba(14,74,92,.88), rgba(8,32,44,.9));
    border: 2px solid var(--edge);
    border-radius: 18px;
    padding: 12px 14px;
    box-shadow: 0 12px 28px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,213,106,.15);
    backdrop-filter: blur(10px);
  }
  .tag {
    display: inline-block; margin-bottom: 6px;
    padding: 3px 9px; border-radius: 999px;
    background: rgba(255,213,106,.16); color: var(--gold);
    font-size: .68rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase;
  }
  .panel h2 { margin: 0 0 6px; font-size: 1.2rem; line-height: 1.2; }
  .muted { opacity: .82; font-size: .86rem; line-height: 1.35; }
  .islands, .ventures { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .island-btn, .venture {
    border: 3px solid rgba(255,255,255,.16);
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(0,0,0,.22));
    color: var(--cream); padding: 8px; cursor: pointer;
    display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center;
    text-align: left; min-height: 78px;
    transition: transform .08s ease;
  }
  .island-btn img, .venture img { width: 64px; height: 64px; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,.35)); }
  .island-btn strong, .venture strong { display: block; color: var(--gold); font-size: .95rem; }
  .island-btn span, .venture small { display: block; font-size: .8rem; line-height: 1.15; margin-top: 2px; }
  .island-btn:active:not(:disabled), .venture:active:not(:disabled) { transform: scale(.96); }
  .island-btn:disabled, .venture:disabled { opacity: .55; }
  .island-btn.picked, .venture.picked { border-color: var(--gold); box-shadow: inset 0 0 0 2px rgba(255,213,106,.25); }
  .island-btn.correct { border-color: var(--ok); }
  .island-btn.wrong { border-color: var(--bad); }
  .island-btn.dim { opacity: .35; }
  .venture .amt { font-family: var(--display); font-size: 1.2rem; text-align: right; }
  .big {
    width: 100%; border: 0; cursor: pointer;
    padding: 15px 16px; border-radius: 16px;
    font-family: var(--display); font-size: 1.25rem; letter-spacing: .04em;
    color: var(--ink);
    background: linear-gradient(180deg, #ffe08a, #e8a820);
    box-shadow: 0 6px 0 #9a6a10, 0 12px 24px rgba(0,0,0,.35);
  }
  .big:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #9a6a10, 0 8px 16px rgba(0,0,0,.3); }
  .big:disabled { filter: grayscale(.4) brightness(.85); }
  .big.pulse { animation: pulse 1.15s ease-in-out infinite; }
  @keyframes pulse { 50% { filter: brightness(1.12); } }
  .ghost {
    border: 2px solid var(--edge); background: rgba(255,255,255,.08);
    color: var(--cream); border-radius: 14px; padding: 12px 14px;
    font: inherit; font-weight: 900; cursor: pointer; width: 100%;
  }
  .invite { display: flex; gap: 6px; }
  .invite input {
    flex: 1; min-width: 0; border-radius: 12px; border: 2px solid var(--edge);
    background: rgba(0,0,0,.35); color: var(--cream); padding: 10px; font-size: .75rem;
  }
  .loot-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .loot-left { display: flex; align-items: center; gap: 6px; font-weight: 900; }
  .loot-left img { width: 26px; height: 26px; }
  #toast {
    position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(140%); z-index: 30;
    background: rgba(20,10,5,.94); border: 2px solid var(--bad);
    color: #fff; padding: 11px 16px; border-radius: 14px; font-weight: 900;
    transition: transform .22s ease; pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #err { min-height: 1em; color: var(--bad); font-size: .85rem; font-weight: 900; }
  .center { text-align: center; }
  .hero-art { width: min(220px, 70%); height: auto; margin: 6px auto; display: block; filter: drop-shadow(0 10px 20px rgba(0,0,0,.4)); }
  .nick-modal {
    position: fixed; inset: 0; z-index: 40; display: grid; place-items: end center;
    background: radial-gradient(circle at 50% 18%, rgba(40,110,130,.5), rgba(5,18,28,.94));
    padding: 16px;
  }
  .nick-modal.hidden { display: none; }
  .nick-modal .panel { width: min(420px, 100%); margin-bottom: 8vh; }
  .nick-modal input {
    width: 100%; margin: 10px 0 12px; border-radius: 14px; border: 2px solid var(--edge);
    background: rgba(0,0,0,.35); color: var(--cream); padding: 14px; font: inherit; font-size: 1.05rem; text-align: center;
  }
  .hand {
    position: absolute; right: 18%; bottom: 28%; width: 64px; height: 64px;
    border-radius: 50%; background: rgba(255,213,106,.25); border: 2px solid var(--gold);
    animation: hand 1.2s ease-in-out infinite; pointer-events: none; z-index: 5;
  }
  @keyframes hand { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-10px,-14px) scale(1.08); } }
  .casino-flash {
    position: fixed; inset: 0; pointer-events: none; z-index: 15;
    background: radial-gradient(circle at 50% 40%, rgba(255,0,200,.18), transparent 55%),
                radial-gradient(circle at 30% 70%, rgba(0,255,255,.12), transparent 45%);
    opacity: 0; transition: opacity .3s ease;
  }
  .casino-flash.on { opacity: 1; }
  .pop { animation: pop .34s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="sea"></canvas>
  <div class="casino-flash" id="casino"></div>
  <div id="hud">
    <div class="top">
      <div class="brand">
        <h1>TREASURE TRAP</h1>
        <p id="subtitle">Voyage</p>
      </div>
      <div class="chest-timer" id="chestWrap" title="Timer">
        <img id="chestImg" src="./assets/chest-full.png" alt="">
        <div class="sec" id="chestSec">–</div>
      </div>
    </div>
    <div class="ribbon" id="ribbon"></div>
    <div class="grow" id="main"></div>
    <div id="err"></div>
  </div>
</div>
<div id="toast"></div>
<div class="nick-modal" id="nickModal">
  <div class="panel center">
    <div class="tag">Path B · Mobile voyage</div>
    <h2 class="display">Name your pirate</h2>
    <p class="muted">Comedy-led adventure. Play vs bot or invite friends.</p>
    <input id="nickInput" maxlength="14" placeholder="Cap’n Spark" autocomplete="nickname">
    <button class="big pulse" id="nickBot">PLAY VS BOT</button>
    <button class="ghost" id="nickGo" style="margin-top:8px">INVITE FRIENDS</button>
  </div>
</div>
<script>
(() => {
  const LETTERS = ["A","B","C","D"];
  const ISLAND = ["./assets/island-a.png","./assets/island-b.png","./assets/island-c.png","./assets/island-d.png"];
  const SHIP = ["./assets/ship-0.png","./assets/ship-1.png","./assets/ship-2.png","./assets/ship-3.png"];
  const PORTRAIT = ["./assets/portrait-0.png","./assets/portrait-1.png","./assets/portrait-2.png","./assets/portrait-3.png"];

  const params = new URLSearchParams(location.search);
  let room = params.get("room");
  if (!room) {
    room = Math.random().toString(36).slice(2, 8);
    params.set("room", room);
    history.replaceState(null, "", location.pathname + "?" + params);
  }

  let nick = sessionStorage.getItem("tt-nick") || "";
  let playerId = sessionStorage.getItem("mp-player-id");
  let wantBot = params.get("bot") === "1" || sessionStorage.getItem("tt-vs-bot") === "1";
  let seenOnboard = sessionStorage.getItem("tt-onboard") === "1";

  function setIdentity(name) {
    nick = String(name || "Pirate").trim().slice(0, 14) || "Pirate";
    sessionStorage.setItem("tt-nick", nick);
    playerId = "p-" + Math.random().toString(36).slice(2, 10) + "::" + encodeURIComponent(nick);
    sessionStorage.setItem("mp-player-id", playerId);
  }
  if (playerId && nick && !playerId.includes("::")) {
    playerId = playerId + "::" + encodeURIComponent(nick);
    sessionStorage.setItem("mp-player-id", playerId);
  }

  const mainEl = document.getElementById("main");
  const ribbonEl = document.getElementById("ribbon");
  const errEl = document.getElementById("err");
  const toastEl = document.getElementById("toast");
  const subtitleEl = document.getElementById("subtitle");
  const nickModal = document.getElementById("nickModal");
  const nickInput = document.getElementById("nickInput");
  const casinoEl = document.getElementById("casino");
  const chestImg = document.getElementById("chestImg");
  const chestSec = document.getElementById("chestSec");

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove("show"), 1500);
  }
  function enableBotMode() {
    wantBot = true;
    sessionStorage.setItem("tt-vs-bot", "1");
    params.set("bot", "1");
    history.replaceState(null, "", location.pathname + "?" + params);
  }

  const base = location.pathname.replace(/\/+$/, "");
  const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + base + "/ws/" + room;

  let ws, botWs = null, botId = sessionStorage.getItem("tt-bot-id") || "";
  let lastState = null, clockSkew = 0, timeoutSentFor = null, shakeUntil = 0;
  let botBusyKey = "", botTimers = [];
  let chosenIsland = [null, null, null, null];
  let sailProgress = [0, 0, 0, 0];
  let pathPreview = null;
  let hitStopUntil = 0;
  let fxPoseidon = 0, fxShark = 0, fxBurst = 0;

  const BOT_ANSWERS = [0, 0, 1];
  const BOT_NAMES = ["Barnacle Bot", "Polly", "Salty Chip", "Deckhand Dan"];

  function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
  function act(a) { send({ type: "action", action: a }); }
  function botSend(o) { if (botWs && botWs.readyState === 1) botWs.send(JSON.stringify(o)); }
  function botAct(a) { botSend({ type: "action", action: a }); }
  function later(ms, fn) { const id = setTimeout(fn, ms); botTimers.push(id); }
  function clearBotTimers() { botTimers.forEach(clearTimeout); botTimers = []; }

  function ensureBotId() {
    if (botId) return botId;
    const name = BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
    botId = "bot-" + Math.random().toString(36).slice(2, 8) + "::" + encodeURIComponent(name);
    sessionStorage.setItem("tt-bot-id", botId);
    return botId;
  }

  function connectBot() {
    if (!wantBot) return;
    ensureBotId();
    if (botWs && (botWs.readyState === 0 || botWs.readyState === 1)) return;
    botWs = new WebSocket(wsUrl);
    botWs.onopen = () => botSend({ type: "join", playerId: botId });
    botWs.onclose = () => { if (wantBot) later(1200, connectBot); };
    botWs.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === "state") driveBot(msg);
    };
  }

  function pickBotAnswer(qi) {
    const c = BOT_ANSWERS[qi] ?? 0;
    if (Math.random() < 0.65) return c;
    let w = Math.floor(Math.random() * 4);
    return w === c ? (w + 1) % 4 : w;
  }

  function driveBot(s) {
    if (!wantBot || !s.view || s.you !== botId) return;
    const v = s.view, you = v.you;
    if (s.status !== "playing") return;
    const key = [v.phase, v.questionIndex, v.deadlineAt, you.answered, you.locked, you.ready, you.lootLeft, v.lootVentureIndex].join(":");
    if (key === botBusyKey) return;

    if (v.phase === "lobby" && !you.ready) {
      botBusyKey = key;
      later(400, () => botAct({ type: "ready" }));
      return;
    }
    if (v.phase === "question" && !you.answered) {
      botBusyKey = key;
      later(800 + Math.random() * 1400, () => botAct({ type: "answer", index: pickBotAnswer(v.questionIndex) }));
      return;
    }
    if (v.phase === "loot" && !you.locked) {
      botBusyKey = key;
      const pool = you.lootPool || 0;
      later(600, () => {
        // Bot often picks wrong for Poseidon drama, sometimes correct
        const pick = Math.random() < 0.45 ? "v2" : "v0";
        const amt = Math.floor(pool / 10) * 10;
        if (amt > 0) botAct({ type: "alloc", venture: pick, amount: amt });
        later(500, () => botAct({ type: "lock" }));
      });
      return;
    }
    if (["q_reveal","loot_intro","loot_reveal","loot_wildcard"].includes(v.phase) && v.deadlineAt) {
      const rem = v.deadlineAt - (Date.now() + clockSkew);
      if (rem <= 250) { botBusyKey = key; botAct({ type: "timeout" }); }
    }
  }

  function connect() {
    if (!playerId) return;
    ws = new WebSocket(wsUrl);
    ws.onopen = () => {
      errEl.textContent = "";
      send({ type: "join", playerId });
      if (wantBot) later(350, connectBot);
    };
    ws.onclose = () => { subtitleEl.textContent = "Reconnecting…"; setTimeout(connect, 1400); };
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === "error") {
        errEl.textContent = msg.error || "Rejected";
        toast(msg.error || "Nope!");
        shakeUntil = performance.now() + 420;
        return;
      }
      if (msg.type !== "state") return;
      errEl.textContent = "";
      const prev = lastState && lastState.view && lastState.view.phase;
      lastState = msg;
      if (msg.view && msg.view.serverNow) clockSkew = msg.view.serverNow - Date.now();
      if (msg.view && prev && prev !== msg.view.phase) {
        if (msg.view.phase === "q_reveal" || msg.view.phase === "loot_reveal") hitStopUntil = performance.now() + 70;
        if (msg.view.phase === "loot_wildcard" && msg.view.reveal) {
          if (msg.view.reveal.poseidon) fxPoseidon = performance.now() + 2600;
          if (msg.view.reveal.shark) fxShark = performance.now() + 2200;
          casinoEl.classList.add("on");
          setTimeout(() => casinoEl.classList.remove("on"), 1800);
        }
        if (msg.view.phase === "winner") fxBurst = performance.now() + 2000;
      }
      render(msg);
      if (wantBot && msg.status === "waiting") connectBot();
    };
  }

  function serverNowApprox() { return Date.now() + clockSkew; }
  function remainingMs(v) {
    if (!v || !v.deadlineAt) return null;
    return v.deadlineAt - serverNowApprox();
  }

  function tickClock(v) {
    const rem = remainingMs(v);
    if (rem == null) {
      chestSec.textContent = "∞";
      chestImg.src = "./assets/chest-full.png";
      return;
    }
    const sec = Math.max(0, Math.ceil(rem / 1000));
    chestSec.textContent = String(sec);
    const total = v.phase === "loot" ? v.lootMs : (v.phase === "question" ? v.qMs : 3000);
    const t = Math.max(0, Math.min(1, rem / total));
    chestImg.src = t < 0.35 ? "./assets/chest-low.png" : "./assets/chest-full.png";
    chestWrap.style.filter = (v.phase === "question" || v.phase === "loot") && t < 0.28
      ? "drop-shadow(0 0 10px #ff7a6e)" : "drop-shadow(0 4px 10px rgba(0,0,0,.35))";
    if (rem <= 0 && lastState && lastState.status === "playing") {
      const key = String(v.deadlineAt) + ":" + v.phase + ":" + (v.lootVentureIndex || 0);
      if (timeoutSentFor !== key) {
        timeoutSentFor = key;
        act({ type: "timeout" });
      }
    }
  }
  const chestWrap = document.getElementById("chestWrap");

  // --- canvas diorama ---
  const sea = document.getElementById("sea");
  const sctx = sea.getContext("2d");
  let bg = null, cabin = null, fogImg = null;
  let shipImgs = [], islandImgs = [], poseidonImg = null, sharkImg = null;
  const t0 = performance.now();

  function loadImg(src) {
    return new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
  }
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 1.75);
    sea.width = innerWidth * dpr; sea.height = innerHeight * dpr;
    sea.style.width = innerWidth + "px"; sea.style.height = innerHeight + "px";
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", resize); addEventListener("orientationchange", resize); resize();

  function islandPos(i, W, H) {
    const slots = [
      { x: W * 0.22, y: H * 0.30 },
      { x: W * 0.78, y: H * 0.30 },
      { x: W * 0.20, y: H * 0.48 },
      { x: W * 0.80, y: H * 0.48 },
    ];
    return slots[i];
  }
  function fleetPos(seat, n, W, H) {
    const spread = Math.min(0.56, 0.16 * n);
    const start = 0.5 - spread / 2;
    return { x: W * (start + (spread * (seat + 0.5) / n)), y: H * 0.72 };
  }

  function drawSea(now) {
    const W = innerWidth, H = innerHeight;
    if (now < hitStopUntil) return;
    const shake = now < shakeUntil ? Math.sin(now * 0.09) * 5 : 0;
    sctx.save();
    sctx.translate(shake, 0);

    const v = lastState && lastState.view;
    const useCabin = v && (v.phase === "loot" || v.phase === "loot_intro");
    const plate = useCabin && cabin ? cabin : bg;
    if (plate) {
      const scale = Math.max(W / plate.width, H / plate.height);
      const dw = plate.width * scale, dh = plate.height * scale;
      // parallax drift
      const t = (now - t0) / 1000;
      const ox = Math.sin(t * 0.15) * 8;
      sctx.drawImage(plate, (W - dw) / 2 + ox, (H - dh) / 2, dw, dh);
    } else {
      const g = sctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#1c7a8c"); g.addColorStop(1, "#0a3d4d");
      sctx.fillStyle = g; sctx.fillRect(0, 0, W, H);
    }

    const t = (now - t0) / 1000;
    if (!useCabin) {
      sctx.globalAlpha = 0.2;
      for (let i = 0; i < 5; i++) {
        const y = H * 0.28 + i * H * 0.08;
        sctx.beginPath();
        for (let x = 0; x <= W; x += 14) {
          const yy = y + Math.sin(x * 0.014 + t * 1.5 + i) * 5;
          if (x === 0) sctx.moveTo(x, yy); else sctx.lineTo(x, yy);
        }
        sctx.strokeStyle = "#d8f4ff"; sctx.lineWidth = 2; sctx.stroke();
      }
      sctx.globalAlpha = 1;

      for (let i = 0; i < 4; i++) {
        const p = islandPos(i, W, H);
        const bob = Math.sin(t * 1.1 + i) * 3;
        const im = islandImgs[i];
        const sz = Math.min(120, W * 0.28);
        if (im) sctx.drawImage(im, p.x - sz / 2, p.y - sz / 2 + bob, sz, sz);
        // marker plaque
        sctx.fillStyle = "rgba(10,30,40,.7)";
        sctx.beginPath(); sctx.arc(p.x - sz * 0.32, p.y - sz * 0.28 + bob, 13, 0, Math.PI * 2); sctx.fill();
        sctx.fillStyle = "#ffd56a";
        sctx.font = "900 13px Trebuchet MS,sans-serif";
        sctx.textAlign = "center"; sctx.textBaseline = "middle";
        sctx.fillText(LETTERS[i], p.x - sz * 0.32, p.y - sz * 0.28 + bob);
      }

      // path preview
      if (pathPreview != null) {
        const mySeat = (v && v.players || []).findIndex((p) => p.id === (lastState && lastState.you));
        if (mySeat >= 0) {
          const from = fleetPos(mySeat, Math.max(2, (v.players || []).length), W, H);
          const to = islandPos(pathPreview, W, H);
          sctx.strokeStyle = "rgba(255,213,106,.55)";
          sctx.setLineDash([8, 8]);
          sctx.lineWidth = 3;
          sctx.beginPath(); sctx.moveTo(from.x, from.y - 10); sctx.lineTo(to.x, to.y + 10); sctx.stroke();
          sctx.setLineDash([]);
        }
      }

      const players = (v && v.players) || [];
      const n = Math.max(players.length, 2);
      players.forEach((pl, seat) => {
        const target = chosenIsland[seat];
        const from = fleetPos(seat, n, W, H);
        const to = target == null ? from : (target === -1 ? { x: W * 0.5, y: H * 0.38 } : islandPos(target, W, H));
        const p = sailProgress[seat];
        const x = from.x + (to.x - from.x) * p;
        const y = from.y + (to.y - from.y) * p + Math.sin(t * 2.1 + seat) * 4;
        const im = shipImgs[seat % 4];
        const sz = 78 + (pl.id === (lastState && lastState.you) ? 8 : 0);
        if (target === -1 && fogImg && p > 0.55) {
          sctx.globalAlpha = 0.85;
          sctx.drawImage(fogImg, x - 50, y - 40, 100, 80);
          sctx.globalAlpha = 1;
        }
        if (im) sctx.drawImage(im, x - sz / 2, y - sz / 2, sz, sz);
        // nameplate
        sctx.fillStyle = "rgba(8,24,32,.75)";
        roundRect(sctx, x - 42, y + 30, 84, 18, 8); sctx.fill();
        sctx.fillStyle = "#fff6e4";
        sctx.font = "800 11px Trebuchet MS,sans-serif";
        sctx.textAlign = "center";
        sctx.fillText((pl.isBot ? "🤖 " : "") + pl.nick, x, y + 42);
      });
    }

    if (now < fxPoseidon && poseidonImg) {
      const a = Math.min(1, (fxPoseidon - now) / 600);
      sctx.globalAlpha = a;
      const sz = Math.min(280, W * 0.7);
      sctx.drawImage(poseidonImg, W / 2 - sz / 2, H * 0.22, sz, sz);
      sctx.globalAlpha = 1;
    }
    if (now < fxShark && sharkImg) {
      const a = Math.min(1, (fxShark - now) / 500);
      const x = W * (0.2 + 0.6 * (1 - (fxShark - now) / 2200));
      sctx.globalAlpha = a;
      sctx.drawImage(sharkImg, x, H * 0.55, 110, 110);
      sctx.globalAlpha = 1;
    }

    sctx.restore();
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function frame(now) {
    requestAnimationFrame(frame);
    for (let i = 0; i < 4; i++) {
      const want = chosenIsland[i] == null ? 0 : 1;
      sailProgress[i] += (want - sailProgress[i]) * 0.07;
    }
    drawSea(now);
    if (lastState && lastState.view) tickClock(lastState.view);
    else tickClock(null);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
  }

  function renderRibbon(v, you) {
    if (!v) { ribbonEl.innerHTML = ""; return; }
    ribbonEl.innerHTML = v.players.map((p, i) => {
      const isYou = p.id === you;
      return `<div class="chip${isYou ? " you" : ""}${p.isBot ? " bot" : ""}"><img src="${PORTRAIT[i % 4]}" alt=""><span>${esc(p.nick)} · ${p.score}</span></div>`;
    }).join("");
  }

  function syncShips(s, v) {
    const players = v.players || [];
    players.forEach((p, seat) => {
      if (v.phase === "question") {
        if (p.id === s.you) chosenIsland[seat] = v.you.answerIndex;
        else if (p.answered) chosenIsland[seat] = -1; // fog hide
        else chosenIsland[seat] = null;
      } else if (v.phase === "q_reveal" && v.reveal && v.reveal.results) {
        const r = v.reveal.results[p.id];
        chosenIsland[seat] = r && r.index != null ? r.index : null;
      } else if (v.phase === "loot_reveal" && v.reveal) {
        chosenIsland[seat] = v.lootVentureIndex;
      } else {
        chosenIsland[seat] = null;
      }
    });
  }

  function renderWaiting(s) {
    pathPreview = null;
    subtitleEl.textContent = wantBot ? "Calling deckhand…" : "Gathering crew…";
    mainEl.innerHTML = `<div class="panel center pop">
      <div class="tag">Waiting room</div>
      <h2 class="display">${wantBot ? "Practice duel" : "Invite rivals"}</h2>
      <p class="muted">${wantBot ? "Bot boarding for a rivalry warm-up." : "Share the link — voyage needs at least 2 captains (up to 4)."}</p>
      ${wantBot ? "" : `<div class="invite" style="margin-top:10px"><input readonly id="link" value="${esc(location.href)}"><button class="ghost" id="copyBtn" style="width:auto">COPY</button></div>`}
      <p class="muted" style="margin-top:10px">Connected: ${s.connected || 1}</p>
      ${wantBot ? "" : `<button class="big pulse" id="waitBot" style="margin-top:10px">PLAY VS BOT</button>`}
    </div>`;
    const c = document.getElementById("copyBtn");
    if (c) c.onclick = async () => { try { await navigator.clipboard.writeText(location.href); toast("Copied!"); } catch { toast("Copy link"); } };
    const b = document.getElementById("waitBot");
    if (b) b.onclick = () => { enableBotMode(); toast("Bot incoming!"); connectBot(); };
  }

  function renderLobby(s, v) {
    pathPreview = null;
    subtitleEl.textContent = "Lobby";
    const you = v.you;
    const readyCount = v.players.filter((p) => p.ready).length;
    mainEl.innerHTML = `<div class="panel center pop">
      <div class="tag">Cast off</div>
      <h2 class="display">Crew of ${v.players.length}</h2>
      <p class="muted">${readyCount}/${v.players.length} ready. Host starts the voyage.</p>
      <button class="big${!you.ready ? " pulse" : ""}" id="readyBtn">${you.ready ? "READY!" : "READY UP"}</button>
      ${you.isHost ? `<button class="big pulse" id="startBtn" style="margin-top:8px" ${readyCount < v.players.length ? "disabled" : ""}>CAST OFF</button>` : `<p class="muted" style="margin-top:8px">Waiting on host…</p>`}
    </div>`;
    document.getElementById("readyBtn").onclick = () => act({ type: "ready" });
    const st = document.getElementById("startBtn");
    if (st) st.onclick = () => act({ type: "start" });
  }

  function renderQuestion(s, v) {
    const q = v.question, you = v.you;
    const can = s.status === "playing" && s.seats.includes(s.you) && v.phase === "question" && !you.answered;
    subtitleEl.textContent = `Q ${v.questionIndex + 1}/${v.questionTotal}`;
    syncShips(s, v);
    pathPreview = you.answerIndex;
    mainEl.innerHTML = `<div class="panel pop">
      <div class="tag">Sail banner</div>
      <h2 class="display">${esc(q.text)}</h2>
      <p class="muted">${you.answered ? "Sailed — rivals may hide in fog…" : "Preview a path, then commit."}</p>
    </div>
    <div class="islands" id="islands"></div>
    ${!seenOnboard && can ? '<div class="hand" id="ghostHand"></div>' : ""}`;
    const root = document.getElementById("islands");
    q.answers.forEach((label, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "island-btn" + (you.answerIndex === i ? " picked" : "");
      btn.disabled = !can;
      btn.innerHTML = `<img src="${ISLAND[i]}" alt=""><div><strong>${LETTERS[i]}</strong><span>${esc(label)}</span></div>`;
      btn.onclick = () => {
        if (!can) return;
        pathPreview = i;
        seenOnboard = true; sessionStorage.setItem("tt-onboard", "1");
        const hand = document.getElementById("ghostHand"); if (hand) hand.remove();
        const my = v.players.findIndex((p) => p.id === s.you);
        if (my >= 0) chosenIsland[my] = i;
        hitStopUntil = performance.now() + 50;
        act({ type: "answer", index: i });
      };
      root.appendChild(btn);
    });
  }

  function renderQReveal(s, v) {
    syncShips(s, v);
    pathPreview = null;
    const q = v.question, rev = v.reveal;
    const my = rev && rev.results ? rev.results[s.you] : null;
    subtitleEl.textContent = "Reveal!";
    mainEl.innerHTML = `<div class="panel pop">
      <div class="tag">Answer reveal</div>
      <h2 class="display">${my && my.correct ? `Spot on! +${my.delta}` : "Missed the mark"}</h2>
      <p class="muted">${esc(q.text)}</p>
    </div><div class="islands" id="islands"></div>`;
    const root = document.getElementById("islands");
    q.answers.forEach((label, i) => {
      const btn = document.createElement("button");
      btn.type = "button"; btn.disabled = true;
      btn.className = "island-btn";
      if (i === rev.correctIndex) btn.classList.add("correct");
      else btn.classList.add("dim");
      if (my && my.index === i && !my.correct) btn.classList.add("wrong");
      btn.innerHTML = `<img src="${ISLAND[i]}" alt=""><div><strong>${LETTERS[i]}</strong><span>${esc(label)}</span></div>`;
      root.appendChild(btn);
    });
  }

  function renderLootIntro(s, v) {
    pathPreview = null;
    subtitleEl.textContent = "Loot Drop";
    casinoEl.classList.add("on");
    setTimeout(() => casinoEl.classList.remove("on"), 1200);
    mainEl.innerHTML = `<div class="panel center pop">
      <div class="tag">Special round</div>
      <img class="hero-art" src="./assets/chest-full.png" alt="">
      <h2 class="display">The sea changes…</h2>
      <p class="muted">Event on the horizon — captain’s map next. Send crews to ventures. Only the true island returns your loot.</p>
    </div>`;
  }

  function renderLoot(s, v) {
    pathPreview = null;
    subtitleEl.textContent = "Allocate crews";
    const you = v.you;
    const can = s.status === "playing" && s.seats.includes(s.you) && !you.locked;
    mainEl.innerHTML = `<div class="panel pop">
      <div class="tag">Captain’s map</div>
      <div class="loot-bar">
        <div class="loot-left"><img src="./assets/crew-token.png" alt=""><span>${you.lootLeft}</span> crew gold</div>
        <div class="muted">${you.locked ? "LOCKED" : "Tap ventures · private"}</div>
      </div>
      <p class="muted" style="margin-bottom:8px">${esc((v.question && v.question.text) || "Where’s the treasure?")}</p>
      <div class="ventures" id="ventures"></div>
    </div>
    <button class="big${can ? " pulse" : ""}" id="lockBtn" ${can ? "" : "disabled"}>
      <img src="./assets/wheel.png" alt="" style="width:28px;height:28px;vertical-align:middle;margin-right:8px"> ${you.locked ? "LOCKED!" : "TURN THE WHEEL"}
    </button>`;
    const root = document.getElementById("ventures");
    v.ventures.forEach((ven, i) => {
      const amt = you.allocation[ven.id] || 0;
      const el = document.createElement("button");
      el.type = "button"; el.className = "venture" + (amt > 0 ? " picked" : "");
      el.disabled = !can;
      el.innerHTML = `<img src="${ISLAND[ven.island]}" alt=""><div><strong>${esc(ven.name)}</strong><small>Crew tokens</small></div><div class="amt">${amt}</div>`;
      el.onclick = () => {
        if (!can) return;
        if (you.lootLeft <= 0) { toast("NO LOOT LEFT!"); shakeUntil = performance.now() + 400; return; }
        const step = v.step || 10;
        const add = you.lootLeft >= step * 2 ? step * 2 : step;
        act({ type: "alloc", venture: ven.id, amount: amt + Math.min(add, you.lootLeft) });
      };
      root.appendChild(el);
    });
    document.getElementById("lockBtn").onclick = () => {
      if (!can) return;
      hitStopUntil = performance.now() + 80;
      casinoEl.classList.add("on");
      setTimeout(() => casinoEl.classList.remove("on"), 700);
      act({ type: "lock" });
    };
  }

  function renderLootReveal(s, v) {
    syncShips(s, v);
    const vi = v.lootVentureIndex || 0;
    const ven = v.ventures[vi];
    const rev = v.reveal;
    const mine = rev && rev.outcomes ? rev.outcomes[s.you] : null;
    const cell = mine && mine.byVenture ? mine.byVenture[ven.id] : null;
    const ok = cell && cell.ok;
    subtitleEl.textContent = `Venture ${vi + 1}/4`;
    mainEl.innerHTML = `<div class="panel center pop">
      <div class="tag">${ok ? "Safe return" : "Reef crash"}</div>
      <img class="hero-art" src="${ISLAND[ven.island]}" alt="">
      <h2 class="display">${esc(ven.name)}</h2>
      <p class="muted">${cell ? (ok ? `Your crews return with ${cell.got} gold!` : (cell.put ? "Comic crash — loot lost on the reef." : "You sent nobody here.")) : "Revealing…"}</p>
    </div>`;
    if (ok === false && cell && cell.put) shakeUntil = performance.now() + 380;
    if (ok) fxBurst = performance.now() + 900;
  }

  function renderWildcard(s, v) {
    const rev = v.reveal || {};
    subtitleEl.textContent = "Wild seas";
    let body = `<p class="muted">Ventures resolved.</p>`;
    if (rev.poseidon) {
      const who = (v.players.find((p) => p.id === rev.poseidon.playerId) || {}).nick || "A pirate";
      body = `<img class="hero-art" src="./assets/poseidon.png" alt="">
        <h2 class="display">Poseidon rises!</h2>
        <p class="muted">${esc(who)} is rescued — majestic… then a comedic splash. +${rev.poseidon.amount}</p>`;
    } else if (rev.shark) {
      body = `<img class="hero-art" src="./assets/shark.png" alt="">
        <h2 class="display">Funny sharks!</h2>
        <p class="muted">Success first — then a cheeky bite of the haul.</p>`;
    } else {
      body = `<h2 class="display">Seas settle</h2><p class="muted">No wildcards this voyage.</p>`;
    }
    mainEl.innerHTML = `<div class="panel center pop"><div class="tag">Wildcard</div>${body}</div>`;
  }

  function renderWinner(s, v) {
    pathPreview = null;
    subtitleEl.textContent = "Champion";
    const winnerId = s.result && s.result.winner;
    const win = (v.players || []).find((p) => p.id === winnerId);
    const youWin = winnerId === s.you;
    mainEl.innerHTML = `<div class="panel center pop">
      <div class="tag">Voyage complete</div>
      <img class="hero-art" src="./assets/chest-full.png" alt="">
      <h2 class="display">${youWin ? "You rule these waters!" : esc((win && win.nick) || "Rival") + " takes the gold"}</h2>
      <p class="muted">${wantBot ? "Rematch keeps your bot rival." : "Same room — play again."}</p>
      <button class="big pulse" id="resetBtn" style="margin-top:10px">PLAY AGAIN</button>
    </div>`;
    document.getElementById("resetBtn").onclick = () => {
      botBusyKey = ""; clearBotTimers();
      send({ type: "reset" });
      if (wantBot) later(300, connectBot);
    };
  }

  function render(s) {
    const v = s.view;
    renderRibbon(v, s.you);
    if (s.status === "waiting" || !v) { renderWaiting(s); return; }
    if (s.status === "over" || v.phase === "winner") { renderWinner(s, v); return; }
    if (v.phase === "lobby") renderLobby(s, v);
    else if (v.phase === "question") renderQuestion(s, v);
    else if (v.phase === "q_reveal") renderQReveal(s, v);
    else if (v.phase === "loot_intro") renderLootIntro(s, v);
    else if (v.phase === "loot") renderLoot(s, v);
    else if (v.phase === "loot_reveal") renderLootReveal(s, v);
    else if (v.phase === "loot_wildcard") renderWildcard(s, v);
    else renderWaiting(s);
  }

  async function boot() {
    bg = await loadImg("./assets/bg-sea.jpg");
    cabin = await loadImg("./assets/map-cabin.jpg");
    fogImg = await loadImg("./assets/fog.png");
    poseidonImg = await loadImg("./assets/poseidon.png");
    sharkImg = await loadImg("./assets/shark.png");
    shipImgs = await Promise.all(SHIP.map(loadImg));
    islandImgs = await Promise.all(ISLAND.map(loadImg));
    requestAnimationFrame(frame);

    function start(vsBot) {
      const n = nickInput.value.trim() || nick;
      if (!n) { toast("Pick a nickname!"); return; }
      setIdentity(n);
      if (vsBot) enableBotMode();
      else {
        wantBot = false;
        sessionStorage.removeItem("tt-vs-bot");
        params.delete("bot");
        history.replaceState(null, "", location.pathname + "?" + params);
      }
      nickModal.classList.add("hidden");
      connect();
    }

    if (nick && playerId) {
      nickModal.classList.add("hidden");
      connect();
    } else {
      nickInput.value = nick || "";
      nickInput.focus();
      document.getElementById("nickBot").onclick = () => start(true);
      document.getElementById("nickGo").onclick = () => start(false);
      nickInput.addEventListener("keydown", (e) => { if (e.code === "Enter") start(true); });
    }
  }
  boot();
})();
</script>
</body>
</html>
