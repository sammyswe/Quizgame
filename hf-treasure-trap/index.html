<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treasure Trap: Voyage</title>
<style>
  :root {
    --sea-deep: #0a3d4d;
    --cream: #fff6e4;
    --gold: #ffd56a;
    --ink: #1a1008;
    --sheet: #123a4a;
    --sheet-2: #0d2e3c;
    --choice: #1a4d5e;
    --choice-hi: #245f73;
    --edge: #c9963a;
    --ok: #3dcc8a;
    --bad: #e85a4f;
    --display: "Trebuchet MS", "Segoe UI", "Avenir Next", sans-serif;
    --body: "Segoe UI", "Trebuchet MS", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--sea-deep); color: var(--cream);
    font-family: var(--body); font-weight: 700;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  h1,h2,.display { font-family: var(--display); font-weight: 800; letter-spacing: .02em; }
  #stage { position: fixed; inset: 0; }
  canvas#sea { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud {
    position: relative; z-index: 2;
    height: 100%; width: min(480px, 100%);
    margin: 0 auto;
    display: flex; flex-direction: column;
    pointer-events: none;
  }
  #hud > * { pointer-events: auto; }
  .world-space { flex: 1; min-height: 0; pointer-events: none; position: relative; }
  /* Island loot video plays ON the quiz sea, not a separate takeover */
  #worldFx {
    position: absolute; left: 50%; top: 42%;
    transform: translate(-50%, -50%) scale(.92);
    width: min(78vw, 340px); aspect-ratio: 1;
    z-index: 6; display: none; pointer-events: none;
    border: 4px solid var(--edge);
    border-radius: 18px; overflow: hidden;
    background: #041018;
    box-shadow: 0 12px 28px rgba(0,0,0,.55), 0 0 0 3px #5a3a12;
  }
  #worldFx.on { display: block; animation: fxIn .35s cubic-bezier(.2,1.3,.4,1) both; }
  #worldFx video { width: 100%; height: 100%; object-fit: cover; display: block; background: #041018; }
  #worldFx .fx-label {
    position: absolute; left: 8px; top: 8px; padding: 3px 8px; border-radius: 999px;
    background: #3a2a10; color: var(--gold); font-size: .62rem; font-weight: 900;
    letter-spacing: .06em; text-transform: uppercase;
  }
  @keyframes fxIn { from { transform: translate(-50%, -50%) scale(.72); } to { transform: translate(-50%, -50%) scale(1); } }
  /* Solid quiz sheet — chrome lives HERE at the bottom, not over the sea */
  .quiz-sheet {
    flex: 0 0 auto;
    max-height: 46vh;
    background: linear-gradient(180deg, #164556 0%, var(--sheet-2) 100%);
    border-top: 3px solid var(--edge);
    box-shadow: 0 -14px 32px rgba(0,0,0,.5);
    padding: 10px 10px 0;
    display: flex; flex-direction: column; gap: 8px;
    overflow: auto;
  }
  #main { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .dock-chrome {
    flex: 0 0 auto;
    margin: 2px -10px 0;
    padding: 8px 10px max(10px, env(safe-area-inset-bottom));
    background: linear-gradient(180deg, #0c2a36 0%, #081820 100%);
    border-top: 2px solid #8a6828;
    display: flex; flex-direction: column; gap: 6px;
  }
  .dock-chrome .top {
    display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center;
  }
  .brand h1 { margin: 0; font-size: .95rem; color: var(--gold); text-shadow: 0 2px 0 #1a0e04; }
  .brand p { margin: 0; font-size: .62rem; opacity: .9; }
  .chest-timer { width: 46px; height: 46px; position: relative; filter: drop-shadow(0 3px 8px rgba(0,0,0,.35)); }
  .chest-timer img { width: 100%; height: 100%; object-fit: contain; }
  .chest-timer .sec {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: var(--display); font-size: .95rem; color: #fff; text-shadow: 0 2px 4px #000;
  }
  .ribbon { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; }
  .ribbon::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; display: flex; align-items: center; gap: 5px;
    padding: 3px 8px 3px 3px; background: #123a4a; border: 2px solid var(--edge);
    border-radius: 999px; font-size: .72rem; font-weight: 900;
  }
  .chip img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
  .chip.you { border-color: var(--gold); }
  .banner {
    background: linear-gradient(180deg, #18485a 0%, #0f3342 100%);
    border: 2px solid var(--edge);
    border-radius: 14px;
    padding: 10px 12px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
  }
  .banner .tag, .quiz-sheet > .tag {
    display: inline-block; margin-bottom: 3px; padding: 2px 7px; border-radius: 999px;
    background: #3a2a10; color: var(--gold);
    font-size: .62rem; font-weight: 900; letter-spacing: .07em; text-transform: uppercase;
  }
  .banner h2 {
    margin: 0; font-size: clamp(.98rem, 3.8vw, 1.15rem); line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .banner .muted { margin: 4px 0 0; opacity: .88; font-size: .76rem; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .choice {
    border: 3px solid #2f7a8e; border-radius: 14px;
    background: linear-gradient(180deg, #226274 0%, var(--choice) 100%);
    color: var(--cream); padding: 9px; cursor: pointer; text-align: left;
    display: grid; grid-template-columns: 44px 1fr auto; gap: 7px; align-items: center;
    min-height: 58px; transition: transform .08s ease, background .12s ease, border-color .12s ease;
    box-shadow: 0 4px 0 #0a2a34;
  }
  .choice img { width: 44px; height: 44px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,.35)); }
  .choice strong { display: block; color: var(--gold); font-size: .88rem; }
  .choice span { display: block; font-size: .74rem; line-height: 1.15; }
  .choice .amt { font-family: var(--display); font-size: 1rem; color: var(--gold); }
  .choice:active:not(:disabled) { transform: scale(.97); background: var(--choice-hi); }
  .choice:disabled { filter: none; opacity: 1; }
  .choice.picked { border-color: var(--gold); background: #2a5f4a; }
  .choice.correct { border-color: var(--ok); background: #1f5a40; }
  .choice.wrong { border-color: var(--bad); background: #5a2a28; }
  .choice.dim { opacity: .45; }
  .big {
    width: 100%; border: 0; cursor: pointer; padding: 12px 14px; border-radius: 14px;
    font-family: var(--display); font-size: 1.1rem; color: var(--ink);
    background: linear-gradient(180deg, #ffe08a, #e8a820);
    box-shadow: 0 5px 0 #9a6a10, 0 10px 18px rgba(0,0,0,.3);
  }
  .big:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 #9a6a10; }
  .big:disabled { filter: grayscale(.4) brightness(.85); }
  .big.pulse { animation: pulse 1.15s ease-in-out infinite; }
  @keyframes pulse { 50% { filter: brightness(1.12); } }
  .ghost {
    border: 2px solid var(--edge); background: rgba(255,255,255,.08);
    color: var(--cream); border-radius: 12px; padding: 10px 12px;
    font: inherit; font-weight: 900; cursor: pointer; width: 100%;
  }
  .invite { display: flex; gap: 6px; }
  .invite input {
    flex: 1; min-width: 0; border-radius: 10px; border: 2px solid var(--edge);
    background: rgba(0,0,0,.35); color: var(--cream); padding: 8px; font-size: .72rem;
  }
  .loot-bar { display: flex; justify-content: space-between; align-items: center; font-size: .8rem; margin: 4px 0 6px; }
  .loot-bar img { width: 22px; height: 22px; vertical-align: middle; }
  #toast {
    position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(140%); z-index: 30;
    background: rgba(20,10,5,.94); border: 2px solid var(--bad);
    color: #fff; padding: 10px 14px; border-radius: 12px; font-weight: 900;
    transition: transform .22s ease; pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #err { min-height: .9em; color: var(--bad); font-size: .78rem; font-weight: 900; }
  .center { text-align: center; }
  .hero-art { width: min(180px, 55%); height: auto; margin: 4px auto; display: block; filter: drop-shadow(0 8px 16px rgba(0,0,0,.4)); }
  .nick-modal {
    position: fixed; inset: 0; z-index: 40; display: grid; place-items: end center;
    background: radial-gradient(circle at 50% 18%, rgba(40,110,130,.5), rgba(5,18,28,.94));
    padding: 14px;
  }
  .nick-modal.hidden { display: none; }
  .nick-modal .banner, .nick-modal .quiz-sheet {
    width: min(420px, 100%); margin-bottom: 6vh;
    max-height: none; border-radius: 16px; border: 2px solid var(--edge);
  }
  .nick-modal input {
    width: 100%; margin: 8px 0 10px; border-radius: 12px; border: 2px solid var(--edge);
    background: rgba(0,0,0,.35); color: var(--cream); padding: 12px; font: inherit; text-align: center;
  }
  .casino-flash {
    position: fixed; inset: 0; pointer-events: none; z-index: 15;
    background: radial-gradient(circle at 50% 40%, rgba(255,0,200,.18), transparent 55%),
                radial-gradient(circle at 30% 70%, rgba(0,255,255,.12), transparent 45%);
    opacity: 0; transition: opacity .3s ease;
  }
  .casino-flash.on { opacity: 1; }
  /* Full-screen opaque Poseidon VIDEO — never a ghost overlay on the sea */
  #spectacle {
    position: fixed; inset: 0; z-index: 50; display: none;
    background: #041018; flex-direction: column;
  }
  #spectacle.on { display: flex; }
  #spectacle .cs-frame,
  #spectacle video.cs-video {
    flex: 1; min-height: 0; width: 100%; object-fit: cover;
    background: #041018; display: block;
  }
  #spectacle .cs-summary {
    display: none; position: absolute; inset: 0;
    background: linear-gradient(180deg, #0a2a38 0%, #041018 100%);
    flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 18px max(24px, env(safe-area-inset-bottom));
    text-align: center; gap: 10px;
  }
  #spectacle .cs-summary.on { display: flex; }
  #spectacle .cs-summary .tag {
    display: inline-block; padding: 4px 10px; border-radius: 999px;
    background: #3a2a10; color: var(--gold);
    font-size: .7rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase;
  }
  #spectacle .cs-summary h2 {
    margin: 0; font-size: clamp(1.4rem, 6vw, 2rem); color: var(--gold);
    text-shadow: 0 3px 0 #1a0e04;
  }
  #spectacle .cs-summary .gold-line {
    font-family: var(--display); font-size: clamp(1.6rem, 7vw, 2.4rem);
    color: #fff6e4; margin: 6px 0;
  }
  #spectacle .cs-summary .gold-line b { color: var(--gold); }
  #spectacle .cs-summary p { margin: 0; opacity: .9; font-size: .95rem; max-width: 28rem; }
  .pop { animation: pop .3s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform: scale(.94); } to { transform: scale(1); } }
  .hand {
    position: absolute; right: 16%; bottom: 34%; width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255,213,106,.22); border: 2px solid var(--gold);
    animation: hand 1.2s ease-in-out infinite; pointer-events: none; z-index: 5;
  }
  @keyframes hand { 50% { transform: translate(-8px,-12px) scale(1.08); } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="sea"></canvas>
  <div class="casino-flash" id="casino"></div>
  <div id="spectacle" aria-live="polite">
    <video class="cs-video" id="csVideo" playsinline muted></video>
    <div class="cs-summary" id="csSummary">
      <div class="tag" id="csTag">Wildcard</div>
      <h2 class="display" id="csTitle">Poseidon’s Rescue!</h2>
      <div class="gold-line" id="csGold"></div>
      <p id="csBody"></p>
    </div>
  </div>
  <div id="hud">
    <div class="world-space" id="worldSpace">
      <div id="worldFx">
        <div class="fx-label" id="fxLabel">Plunder</div>
        <video id="fxVideo" playsinline muted></video>
      </div>
    </div>
    <div class="quiz-sheet">
      <div id="main"></div>
      <div class="dock-chrome">
        <div class="top">
          <div class="brand"><h1>TREASURE TRAP</h1><p id="subtitle">Voyage</p></div>
          <div class="chest-timer" id="chestWrap">
            <img id="chestImg" src="./assets/chest-full.png" alt="">
            <div class="sec" id="chestSec">–</div>
          </div>
        </div>
        <div class="ribbon" id="ribbon"></div>
      </div>
    </div>
    <div id="err" style="position:absolute;left:8px;right:8px;bottom:52%;pointer-events:none"></div>
  </div>
</div>
<div id="toast"></div>
<div class="nick-modal" id="nickModal">
  <div class="quiz-sheet center" style="border-radius:16px;border:2px solid var(--edge)">
    <div class="tag" style="align-self:center">Mobile voyage</div>
    <h2 class="display">Name your pirate</h2>
    <p class="muted">Play vs bot or invite friends.</p>
    <input id="nickInput" maxlength="14" placeholder="Cap’n Spark" autocomplete="nickname">
    <button class="big pulse" id="nickBot">PLAY VS BOT</button>
    <button class="ghost" id="nickGo" style="margin-top:8px">INVITE FRIENDS</button>
  </div>
</div>
<script>
(() => {
  const LETTERS = ["A","B","C","D"];
  const ISLAND = ["./assets/island-a.png","./assets/island-b.png","./assets/island-c.png","./assets/island-d.png"];
  const SHIP = ["./assets/ship-0.png","./assets/ship-1.png","./assets/ship-2.png","./assets/ship-3.png"];
  const PORTRAIT = ["./assets/portrait-0.png","./assets/portrait-1.png","./assets/portrait-2.png","./assets/portrait-3.png"];
  /** Island-specific loot videos play on the quiz sea when a ship arrives. */
  const LOOT_VID = [
    "./assets/video/loot-a.mp4",
    "./assets/video/loot-b.mp4",
    "./assets/video/loot-c.mp4",
    "./assets/video/loot-d.mp4",
  ];
  const POSEIDON_VID = "./assets/video/poseidon.mp4";
  const LOOT_STILL = ["./assets/cs-plunder-1.jpg", "./assets/cs-plunder-2.jpg"];
  const POSEIDON_STILL = ["./assets/cs-poseidon-1.jpg", "./assets/cs-poseidon-2.jpg", "./assets/cs-poseidon-3.jpg"];

  const params = new URLSearchParams(location.search);
  let room = params.get("room");
  if (!room) {
    room = Math.random().toString(36).slice(2, 8);
    params.set("room", room);
    history.replaceState(null, "", location.pathname + "?" + params);
  }

  let nick = sessionStorage.getItem("tt-nick") || "";
  let playerId = sessionStorage.getItem("mp-player-id");
  let wantBot = params.get("bot") === "1" || sessionStorage.getItem("tt-vs-bot") === "1";
  let seenOnboard = sessionStorage.getItem("tt-onboard") === "1";

  function setIdentity(name) {
    nick = String(name || "Pirate").trim().slice(0, 14) || "Pirate";
    sessionStorage.setItem("tt-nick", nick);
    playerId = "p-" + Math.random().toString(36).slice(2, 10) + "::" + encodeURIComponent(nick);
    sessionStorage.setItem("mp-player-id", playerId);
  }
  if (playerId && nick && !String(playerId).includes("::")) {
    playerId = playerId + "::" + encodeURIComponent(nick);
    sessionStorage.setItem("mp-player-id", playerId);
  }

  const mainEl = document.getElementById("main");
  const ribbonEl = document.getElementById("ribbon");
  const errEl = document.getElementById("err");
  const toastEl = document.getElementById("toast");
  const subtitleEl = document.getElementById("subtitle");
  const nickModal = document.getElementById("nickModal");
  const nickInput = document.getElementById("nickInput");
  const casinoEl = document.getElementById("casino");
  const spectacleEl = document.getElementById("spectacle");
  const csVideoEl = document.getElementById("csVideo");
  const csSummaryEl = document.getElementById("csSummary");
  const csTagEl = document.getElementById("csTag");
  const csTitleEl = document.getElementById("csTitle");
  const csGoldEl = document.getElementById("csGold");
  const csBodyEl = document.getElementById("csBody");
  const worldFxEl = document.getElementById("worldFx");
  const fxVideoEl = document.getElementById("fxVideo");
  const fxLabelEl = document.getElementById("fxLabel");
  const chestImg = document.getElementById("chestImg");
  const chestSec = document.getElementById("chestSec");
  const chestWrap = document.getElementById("chestWrap");

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove("show"), 1400);
  }
  function enableBotMode() {
    wantBot = true;
    sessionStorage.setItem("tt-vs-bot", "1");
    params.set("bot", "1");
    history.replaceState(null, "", location.pathname + "?" + params);
  }

  const base = location.pathname.replace(/\/+$/, "");
  const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + base + "/ws/" + room;

  let ws, botWs = null, botId = sessionStorage.getItem("tt-bot-id") || "";
  let lastState = null, clockSkew = 0, timeoutSentFor = null, shakeUntil = 0;
  let botBusyKey = "", botTimers = [];
  let chosenIsland = [null, null, null, null];
  /** Per-seat curved sail: { from, to, t, curve, key } */
  let sailState = [null, null, null, null];
  let pathPreview = null;
  let hitStopUntil = 0;
  /** Full-screen Poseidon video spectacle */
  let cutscene = null;
  /** On-sea island loot video: { island, t0, waitingForSail, seat } */
  let islandLoot = null;
  let fxParticles = [];
  let wakeDots = [];
  let cam = { x: 0, y: 0, z: 1, tx: 0, ty: 0, tz: 1 };
  let lastFrameAt = performance.now();
  let glitter = [];
  for (let i = 0; i < 28; i++) {
    glitter.push({ x: Math.random(), y: Math.random() * 0.55, s: 1 + Math.random() * 2, ph: Math.random() * Math.PI * 2 });
  }

  const BOT_ANSWERS = [0, 0, 1];
  const BOT_NAMES = ["Barnacle Bot", "Polly", "Salty Chip", "Deckhand Dan"];

  function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
  function act(a) { send({ type: "action", action: a }); }
  function botSend(o) { if (botWs && botWs.readyState === 1) botWs.send(JSON.stringify(o)); }
  function botAct(a) { botSend({ type: "action", action: a }); }
  function later(ms, fn) { const id = setTimeout(fn, ms); botTimers.push(id); }
  function clearBotTimers() { botTimers.forEach(clearTimeout); botTimers = []; }

  function ensureBotId() {
    if (botId) return botId;
    const name = BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
    botId = "bot-" + Math.random().toString(36).slice(2, 8) + "::" + encodeURIComponent(name);
    sessionStorage.setItem("tt-bot-id", botId);
    return botId;
  }
  function connectBot() {
    if (!wantBot) return;
    ensureBotId();
    if (botWs && (botWs.readyState === 0 || botWs.readyState === 1)) return;
    botWs = new WebSocket(wsUrl);
    botWs.onopen = () => botSend({ type: "join", playerId: botId });
    botWs.onclose = () => { if (wantBot) later(1200, connectBot); };
    botWs.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === "state") driveBot(msg);
    };
  }
  function pickBotAnswer(qi) {
    const c = BOT_ANSWERS[qi] ?? 0;
    if (Math.random() < 0.65) return c;
    let w = Math.floor(Math.random() * 4);
    return w === c ? (w + 1) % 4 : w;
  }
  function driveBot(s) {
    if (!wantBot || !s.view || s.you !== botId || s.status !== "playing") return;
    const v = s.view, you = v.you;
    const key = [v.phase, v.questionIndex, v.deadlineAt, you.answered, you.locked, you.ready, you.lootLeft, v.lootVentureIndex].join(":");
    if (key === botBusyKey) return;
    if (v.phase === "lobby" && !you.ready) { botBusyKey = key; later(400, () => botAct({ type: "ready" })); return; }
    if (v.phase === "question" && !you.answered) {
      botBusyKey = key;
      later(900 + Math.random() * 1200, () => botAct({ type: "answer", index: pickBotAnswer(v.questionIndex) }));
      return;
    }
    if (v.phase === "loot" && !you.locked) {
      botBusyKey = key;
      const pool = you.lootPool || 0;
      later(700, () => {
        const pick = Math.random() < 0.45 ? "v2" : "v0";
        void pool;
        botAct({ type: "pick", venture: pick });
        later(500, () => botAct({ type: "lock" }));
      });
      return;
    }
    if (["q_reveal","loot_intro","loot_reveal","loot_wildcard"].includes(v.phase) && v.deadlineAt) {
      const rem = v.deadlineAt - (Date.now() + clockSkew);
      if (rem <= 250) { botBusyKey = key; botAct({ type: "timeout" }); }
    }
  }

  function stopVideo(el) {
    if (!el) return;
    try { el.pause(); el.removeAttribute("src"); el.load(); } catch (_) {}
  }
  function playPoseidonVideo(meta) {
    cutscene = {
      kind: "poseidon",
      t0: performance.now(),
      animMs: 4200,
      summaryMs: 3200,
      meta: meta || {},
      stage: "anim",
    };
    csSummaryEl.classList.remove("on");
    csVideoEl.style.display = "block";
    stopVideo(csVideoEl);
    csVideoEl.src = POSEIDON_VID;
    csVideoEl.onended = () => { if (cutscene && cutscene.stage === "anim") showCutsceneSummary(); };
    csVideoEl.onerror = () => {
      // Still fallback: brief still then summary
      csVideoEl.style.display = "none";
      const img = document.createElement("img");
      img.className = "cs-frame";
      img.src = POSEIDON_STILL[1] || POSEIDON_STILL[0];
      img.id = "csStillFallback";
      spectacleEl.insertBefore(img, csSummaryEl);
      setTimeout(() => showCutsceneSummary(), 1800);
    };
    const p = csVideoEl.play();
    if (p && p.catch) p.catch(() => {});
    spectacleEl.classList.add("on");
    casinoEl.classList.add("on");
  }
  function queueIslandLoot(islandIdx, seat) {
    islandLoot = {
      island: islandIdx,
      seat: seat == null ? 0 : seat,
      t0: performance.now(),
      waitingForSail: true,

      else drawWorldCutscene(now, u, W, H);
    }

    sctx.restore();
  }

  function launchLootFlies(islandIdx) {
    const W = innerWidth, H = innerHeight;
    const from = islandPos(islandIdx, W, H);
    const players = (lastState && lastState.view && lastState.view.players) || [];
    const mySeat = players.findIndex((p) => p.id === (lastState && lastState.you));
    const to = fleetPos(mySeat >= 0 ? mySeat : 0, Math.max(2, players.length), W, H);
    for (let i = 0; i < 10; i++) {
      flyCoins.push({
        x0: from.x + (Math.random() - 0.5) * 30,
        y0: from.y + (Math.random() - 0.5) * 20,
        x1: to.x + (Math.random() - 0.5) * 24,
        y1: to.y,
        t0: performance.now() + i * 55,
        dur: 700 + Math.random() * 280,
      });
    }
  }

  function drawWorldCutscene(now, u, W, H) {
    const sh = seaH(H);
    if (cutscene.kind === "crash") {
      const isl = cutscene.meta.island ?? 0;
      const p = islandPos(isl, W, H);
      drawImg(imgCrash, p.x + 30, p.y + 20, 110);
      if (u < 0.85) drawImg(imgImpact, p.x + 30, p.y + 10, 90);
      shakeUntil = now + 80;
    } else if (cutscene.kind === "shark") {
      const x = W * (0.1 + 0.8 * u);
      drawImg(sharkImg, x, sh * 0.72, 110);
      drawImg(imgSplash, x, sh * 0.8, 90);
    }
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function frame(now) {
    requestAnimationFrame(frame);
    tickCutscene(now);
    tickIslandLoot(now);
    drawSea(now);
    lastFrameAt = now;
    if (lastState && lastState.view) tickClock(lastState.view);
    else tickClock(null);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
  }

  function renderRibbon(v, you) {
    if (!v) { ribbonEl.innerHTML = ""; return; }
    ribbonEl.innerHTML = v.players.map((p, i) => {
      const isYou = p.id === you;
      return `<div class="chip${isYou ? " you" : ""}"><img src="${PORTRAIT[i % 4]}" alt=""><span>${esc(p.nick)} · ${p.score}</span></div>`;
    }).join("");
  }

  function syncShips(s, v) {
    const players = v.players || [];
    const iAnswered = !!(v.you && v.you.answered);
    players.forEach((p, seat) => {
      if (v.phase === "question") {
        if (p.id === s.you) chosenIsland[seat] = v.you.answerIndex;
        else if (iAnswered && p.answered) chosenIsland[seat] = -1; // fog only AFTER you commit
        else chosenIsland[seat] = null; // stay in fleet — no leak
      } else if (v.phase === "q_reveal" && v.reveal && v.reveal.results) {
        const r = v.reveal.results[p.id];
        chosenIsland[seat] = r && r.index != null ? r.index : null;
      } else if (v.phase === "loot_reveal" && v.reveal) {
        chosenIsland[seat] = v.lootVentureIndex;
      } else {
        chosenIsland[seat] = null;
      }
    });
  }

  function renderWaiting(s) {
    pathPreview = null;
    subtitleEl.textContent = wantBot ? "Calling deckhand…" : "Gathering crew…";
    mainEl.innerHTML = `<div class="banner center pop">
      <div class="tag">Waiting room</div>
      <h2 class="display">${wantBot ? "Practice duel" : "Invite rivals"}</h2>
      <p class="muted">${wantBot ? "Bot boarding…" : "Share link — 2–4 captains."}</p>
      ${wantBot ? "" : `<div class="invite" style="margin-top:8px"><input readonly id="link" value="${esc(location.href)}"><button class="ghost" id="copyBtn" style="width:auto">COPY</button></div>`}
      ${wantBot ? "" : `<button class="big pulse" id="waitBot" style="margin-top:8px">PLAY VS BOT</button>`}
    </div>`;
    const c = document.getElementById("copyBtn");
    if (c) c.onclick = async () => { try { await navigator.clipboard.writeText(location.href); toast("Copied!"); } catch { toast("Copy link"); } };
    const b = document.getElementById("waitBot");
    if (b) b.onclick = () => { enableBotMode(); toast("Bot incoming!"); connectBot(); };
  }

  function renderLobby(s, v) {
    pathPreview = null;
    subtitleEl.textContent = "Lobby";
    const you = v.you;
    const readyCount = v.players.filter((p) => p.ready).length;
    mainEl.innerHTML = `<div class="banner center pop">
      <div class="tag">Cast off</div>
      <h2 class="display">Crew of ${v.players.length}</h2>
      <p class="muted">${readyCount}/${v.players.length} ready</p>
      <button class="big${!you.ready ? " pulse" : ""}" id="readyBtn">${you.ready ? "READY!" : "READY UP"}</button>
      ${you.isHost ? `<button class="big pulse" id="startBtn" style="margin-top:6px" ${readyCount < v.players.length ? "disabled" : ""}>CAST OFF</button>` : `<p class="muted">Waiting on host…</p>`}
    </div>`;
    document.getElementById("readyBtn").onclick = () => act({ type: "ready" });
    const st = document.getElementById("startBtn");
    if (st) st.onclick = () => act({ type: "start" });
  }

  function renderQuestion(s, v) {
    const q = v.question, you = v.you;
    const can = s.status === "playing" && s.seats.includes(s.you) && v.phase === "question" && !you.answered;
    subtitleEl.textContent = `Q ${v.questionIndex + 1}/${v.questionTotal}`;
    syncShips(s, v);
    pathPreview = you.answerIndex;
    mainEl.innerHTML = `<div class="banner pop">
      <div class="tag">Sail banner</div>
      <h2 class="display">${esc(q.text)}</h2>
      <p class="muted">${you.answered ? "Waiting for rivals…" : "Pick an island — ships dock beside it."}</p>
    </div>
    <div class="choices" id="choices"></div>
    ${!seenOnboard && can ? '<div class="hand"></div>' : ""}`;
    const root = document.getElementById("choices");
    q.answers.forEach((label, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice" + (you.answerIndex === i ? " picked" : "");
      btn.disabled = !can;
      btn.innerHTML = `<img src="${ISLAND[i]}" alt=""><div><strong>${LETTERS[i]}</strong><span>${esc(label)}</span></div>`;
      btn.onclick = () => {
        if (!can) return;
        pathPreview = i;
        seenOnboard = true; sessionStorage.setItem("tt-onboard", "1");
        const my = v.players.findIndex((p) => p.id === s.you);
        if (my >= 0) chosenIsland[my] = i;
        hitStopUntil = performance.now() + 45;
        act({ type: "answer", index: i });
      };
      root.appendChild(btn);
    });
  }

  function renderQReveal(s, v) {
    syncShips(s, v);
    pathPreview = null;
    const q = v.question, rev = v.reveal;
    const my = rev && rev.results ? rev.results[s.you] : null;
    subtitleEl.textContent = "Reveal!";
    mainEl.innerHTML = `<div class="banner pop">
      <div class="tag">Answer reveal</div>
      <h2 class="display">${my && my.correct ? `Spot on! +${my.delta}` : "Missed the mark"}</h2>
    </div>
    <div class="choices" id="choices"></div>`;
    const root = document.getElementById("choices");
    q.answers.forEach((label, i) => {
      const btn = document.createElement("button");
      btn.type = "button"; btn.disabled = true;
      btn.className = "choice";
      if (i === rev.correctIndex) btn.classList.add("correct");
      else btn.classList.add("dim");
      if (my && my.index === i && !my.correct) btn.classList.add("wrong");
      btn.innerHTML = `<img src="${ISLAND[i]}" alt=""><div><strong>${LETTERS[i]}</strong><span>${esc(label)}</span></div>`;
      root.appendChild(btn);
    });
  }

  function renderLootIntro() {
    pathPreview = null;
    subtitleEl.textContent = "Loot Drop";
    casinoEl.classList.add("on");
    setTimeout(() => casinoEl.classList.remove("on"), 900);
    mainEl.innerHTML = `<div class="banner center pop">
      <div class="tag">Special round</div>
      <h2 class="display">Loot Drop quiz</h2>
      <p class="muted">Answer like a normal question. Your block loot sails with your pick — wrong island crashes, correct returns gold.</p>
    </div>`;
  }

  function renderLoot(s, v) {
    pathPreview = null;
    subtitleEl.textContent = `Loot Drop · ${youPoolLabel(v)}`;
    const you = v.you;
    const can = s.status === "playing" && s.seats.includes(s.you) && !you.locked;
    const q = v.question;
    const picked = v.ventures.findIndex((ven) => (you.allocation[ven.id] || 0) > 0);
    mainEl.innerHTML = `<div class="banner pop">
      <div class="tag">Loot Drop · question</div>
      <h2 class="display">${esc((q && q.text) || "Pick the right island")}</h2>
      <p class="muted">${you.locked ? "Locked in — waiting for rivals…" : `Stake ${you.lootPool} gold on one answer, then lock.`}</p>
    </div>
    <div class="choices" id="choices"></div>
    <button class="big${can && picked >= 0 ? " pulse" : ""}" id="lockBtn" ${can && picked >= 0 ? "" : "disabled"}>
      <img src="./assets/wheel.png" alt="" style="width:24px;height:24px;vertical-align:middle;margin-right:6px">${you.locked ? "LOCKED!" : "TURN THE WHEEL"}
    </button>`;
    const root = document.getElementById("choices");
    (q && q.answers ? q.answers : ["A","B","C","D"]).forEach((label, i) => {
      const ven = v.ventures[i];
      const amt = you.allocation[ven.id] || 0;
      const el = document.createElement("button");
      el.type = "button";
      el.className = "choice" + (amt > 0 ? " picked" : "");
      el.disabled = !can;
      el.innerHTML = `<img src="${ISLAND[i]}" alt=""><div><strong>${LETTERS[i]}</strong><span>${esc(label)}</span></div>${amt > 0 ? `<div class="amt">${amt}</div>` : ""}`;
      el.onclick = () => {
        if (!can) return;
        act({ type: "pick", venture: ven.id });
        pathPreview = i;
        const my = v.players.findIndex((p) => p.id === s.you);
        if (my >= 0) chosenIsland[my] = i;
      };
      root.appendChild(el);
    });
    document.getElementById("lockBtn").onclick = () => {
      if (!can || picked < 0) return;
      hitStopUntil = performance.now() + 70;
      casinoEl.classList.add("on");
      setTimeout(() => casinoEl.classList.remove("on"), 600);
      act({ type: "lock" });
    };
  }
  function youPoolLabel(v) {
    return v && v.you ? `${v.you.lootPool} gold` : "";
  }

  function renderLootReveal(s, v) {
    syncShips(s, v);
    const vi = v.lootVentureIndex || 0;
    const ven = v.ventures[vi];
    const rev = v.reveal;
    const mine = rev && rev.outcomes ? rev.outcomes[s.you] : null;
    const cell = mine && mine.byVenture ? mine.byVenture[ven.id] : null;
    const ok = cell && cell.ok;
    subtitleEl.textContent = `Venture ${vi + 1}/4`;
    mainEl.innerHTML = `<div class="banner center pop">
      <div class="tag">${ok ? "Plunder!" : "Reef crash"}</div>
      <h2 class="display">${esc(ven.name)}</h2>
      <p class="muted">${cell ? (ok ? `Crews return with ${cell.got} gold!` : (cell.put ? "Comic crash — loot lost." : "No crews here.")) : "…"}</p>
    </div>`;
  }

  function renderWildcard(s, v) {
    const rev = v.reveal || {};
    subtitleEl.textContent = "Wild seas";
    // Poseidon summary lives on the full-screen spectacle; keep HUD quiet while it plays.
    if (rev.poseidon && cutscene && cutscene.kind === "poseidon") {
      mainEl.innerHTML = `<div class="banner center"><div class="tag">Wildcard</div>
        <h2 class="display">Poseidon rises…</h2>
        <p class="muted">Full-screen rescue underway.</p></div>`;
      return;
    }
    let body = `<h2 class="display">Seas settle</h2>`;
    if (rev.poseidon) {
      const who = (v.players.find((p) => p.id === rev.poseidon.playerId) || {}).nick || "A pirate";
      body = `<h2 class="display">Poseidon’s Rescue!</h2>
        <p class="muted">${esc(who)} saved — +${rev.poseidon.amount} gold returned.</p>`;
    } else if (rev.shark) {
      body = `<h2 class="display">Funny sharks!</h2><p class="muted">Success first… then a cheeky bite.</p>`;
    }
    mainEl.innerHTML = `<div class="banner center pop"><div class="tag">Wildcard</div>${body}</div>`;
  }

  function renderWinner(s, v) {
    pathPreview = null;
    subtitleEl.textContent = "Champion";
    const winnerId = s.result && s.result.winner;
    const win = (v.players || []).find((p) => p.id === winnerId);
    const youWin = winnerId === s.you;
    mainEl.innerHTML = `<div class="banner center pop">
      <div class="tag">Voyage complete</div>
      <img class="hero-art" src="./assets/chest-full.png" alt="">
      <h2 class="display">${youWin ? "You rule these waters!" : esc((win && win.nick) || "Rival") + " wins"}</h2>
      <button class="big pulse" id="resetBtn" style="margin-top:8px">PLAY AGAIN</button>
    </div>`;
    document.getElementById("resetBtn").onclick = () => {
      botBusyKey = ""; clearBotTimers(); endCutscene(); endIslandLoot();
      send({ type: "reset" });
      if (wantBot) later(300, connectBot);
    };
  }

  function render(s) {
    const v = s.view;
    renderRibbon(v, s.you);
    if (s.status === "waiting" || !v) { renderWaiting(s); return; }
    if (s.status === "over" || v.phase === "winner") { renderWinner(s, v); return; }
    if (v.phase === "lobby") renderLobby(s, v);
    else if (v.phase === "question") renderQuestion(s, v);
    else if (v.phase === "q_reveal") renderQReveal(s, v);
    else if (v.phase === "loot_intro") renderLootIntro();
    else if (v.phase === "loot") renderLoot(s, v);
    else if (v.phase === "loot_reveal") renderLootReveal(s, v);
    else if (v.phase === "loot_wildcard") renderWildcard(s, v);
    else renderWaiting(s);
  }

  async function boot() {
    bg = await loadImg("./assets/bg-sea.jpg");
    cloudsImg = await loadImg("./assets/clouds.png");
    reefImg = await loadImg("./assets/reef-rocks.png");
    gullImg = await loadImg("./assets/seagulls.png");
    fogImg = await loadImg("./assets/fog.png");
    sharkImg = await loadImg("./assets/shark.png");
    shipImgs = await Promise.all(SHIP.map(loadImg));
    islandImgs = await Promise.all(ISLAND.map(loadImg));
    // Preload videos so arrival loot starts instantly
    LOOT_VID.forEach((src) => { const v = document.createElement("video"); v.preload = "auto"; v.muted = true; v.src = src; });
    { const v = document.createElement("video"); v.preload = "auto"; v.muted = true; v.src = POSEIDON_VID; }
    imgCoinBurst = await loadImg("./assets/vfx-coin-burst.png");
    imgChestOpen = await loadImg("./assets/vfx-chest-open.png");
    imgSparkle = await loadImg("./assets/vfx-sparkle.png");
    imgImpact = await loadImg("./assets/vfx-impact.png");
    imgSplash = await loadImg("./assets/vfx-splash.png");
    imgWake = await loadImg("./assets/vfx-wake.png");
    imgCrash = await loadImg("./assets/vfx-reef-crash.png");
    imgConfetti = await loadImg("./assets/vfx-confetti.png");
    imgCheer = await loadImg("./assets/ship-cheer.png");
    imgPlunderCrew = await loadImg("./assets/plunder-crew.png");
    imgLootCascade = await loadImg("./assets/loot-cascade.png");
    imgLootTrail = await loadImg("./assets/loot-trail.png");
    imgLootHaul = await loadImg("./assets/loot-haul.png");
    imgLootBurst = await loadImg("./assets/loot-burst.png");
    void imgCheer;
    requestAnimationFrame(frame);

    function start(vsBot) {
      const n = nickInput.value.trim() || nick;
      if (!n) { toast("Pick a nickname!"); return; }
      setIdentity(n);
      if (vsBot) enableBotMode();
      else {
        wantBot = false;
        sessionStorage.removeItem("tt-vs-bot");
        params.delete("bot");
        history.replaceState(null, "", location.pathname + "?" + params);
      }
      nickModal.classList.add("hidden");
      connect();
    }

    if (nick && playerId) {
      nickModal.classList.add("hidden");
      connect();
    } else {
      nickInput.value = nick || "";
      nickInput.focus();
      document.getElementById("nickBot").onclick = () => start(true);
      document.getElementById("nickGo").onclick = () => start(false);
      nickInput.addEventListener("keydown", (e) => { if (e.code === "Enter") start(true); });
    }
  }
  boot();
})();
</script>
</body>
</html>
