<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treasure Trap: Voyage</title>
<style>
  :root {
    --sea-deep: #0a3d4d;
    --cream: #fff6e4;
    --gold: #ffd56a;
    --ink: #1a1008;
    --sheet: #123a4a;
    --sheet-2: #0d2e3c;
    --choice: #1a4d5e;
    --choice-hi: #245f73;
    --edge: #c9963a;
    --ok: #3dcc8a;
    --bad: #e85a4f;
    --display: "Trebuchet MS", "Segoe UI", "Avenir Next", sans-serif;
    --body: "Segoe UI", "Trebuchet MS", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--sea-deep); color: var(--cream);
    font-family: var(--body); font-weight: 700;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  h1,h2,.display { font-family: var(--display); font-weight: 800; letter-spacing: .02em; }
  #stage { position: fixed; inset: 0; }
  canvas#sea { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud {
    position: relative; z-index: 2;
    height: 100%; width: min(480px, 100%);
    margin: 0 auto;
    display: flex; flex-direction: column;
    pointer-events: none;
  }
  #hud > * { pointer-events: auto; }
  /* Compact top: player scores + chest timer only */
  .top-chrome {
    flex: 0 0 auto;
    padding: max(6px, env(safe-area-inset-top)) 8px 4px;
    display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center;
    background: linear-gradient(180deg, rgba(4,20,28,.72) 0%, rgba(4,20,28,0) 100%);
  }
  .world-space { flex: 1; min-height: 0; pointer-events: none; position: relative; }
  .world-space.loot-active { pointer-events: auto; }
  /* Tap-to-loot panel on the quiz sea */
  #worldFx {
    position: absolute; left: 50%; top: 42%;
    transform: translate(-50%, -50%);
    width: min(86vw, 380px); aspect-ratio: 1;
    z-index: 20; display: none; pointer-events: none;
    border: 5px solid #ffd56a;
    border-radius: 20px; overflow: hidden;
    background:
      radial-gradient(circle at 50% 40%, rgba(255,61,184,.35), transparent 50%),
      radial-gradient(circle at 20% 80%, rgba(61,255,240,.25), transparent 45%),
      linear-gradient(160deg, #1a0840, #041018 60%, #0a2a20);
    box-shadow:
      0 12px 28px rgba(0,0,0,.55),
      0 0 0 3px #ff3db8,
      0 0 0 7px #3dfff0,
      0 0 56px rgba(255,0,180,.55),
      inset 0 0 40px rgba(255,213,106,.12);
    cursor: pointer;
    touch-action: manipulation;
  }
  #worldFx.on { display: block; pointer-events: auto; animation: fxIn .35s cubic-bezier(.2,1.3,.4,1) both; }
  #worldFx.spinning {
    box-shadow:
      0 12px 28px rgba(0,0,0,.55),
      0 0 0 3px #3dfff0,
      0 0 0 7px #ff3db8,
      0 0 64px rgba(61,255,240,.65),
      inset 0 0 40px rgba(255,213,106,.18);
  }
  #worldFx .fx-chest {
    position: absolute; left: 50%; top: 46%; width: 58%; height: auto;
    transform: translate(-50%, -50%);
    pointer-events: none; filter: drop-shadow(0 10px 18px rgba(0,0,0,.45));
    z-index: 1;
  }
  #worldFx .slot-reels {
    position: absolute; left: 10%; right: 10%; top: 8%; height: 18%;
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
    z-index: 2; pointer-events: none;
  }
  #worldFx .slot-reels span {
    display: grid; place-items: center;
    border: 2px solid #ffd56a; border-radius: 10px;
    background: linear-gradient(180deg, #2a1040, #0a1820);
    font-family: var(--display); font-size: 1.15rem; color: #ffd56a;
    box-shadow: inset 0 0 12px rgba(255,61,184,.35);
  }
  #worldFx.empty .slot-reels { display: none; }
  #worldFx .fx-burst {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 2;
  }
  #worldFx.exploding .fx-chest { animation: chestPop .45s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes chestPop { 0% { transform: translate(-50%,-50%) scale(1) rotate(0); } 40% { transform: translate(-50%,-50%) scale(1.25) rotate(-8deg); } 100% { transform: translate(-50%,-50%) scale(1.05) rotate(0); } }
  #worldFx .fx-label {
    position: absolute; left: 8px; top: 8px; padding: 3px 8px; border-radius: 999px;
    background: #3a2a10; color: var(--gold); font-size: .62rem; font-weight: 900;
    letter-spacing: .06em; text-transform: uppercase; z-index: 3;
  }
  #worldFx .tap-hint {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: var(--display); font-size: clamp(1.4rem, 6vw, 2rem);
    color: var(--gold); text-shadow: 0 3px 0 #1a0e04, 0 0 18px rgba(255,0,200,.55);
    z-index: 2; pointer-events: none; animation: tapPulse 0.7s ease-in-out infinite;
  }
  #worldFx .tap-hint.hide { display: none; }
  #worldFx .loot-meter {
    position: absolute; left: 12px; right: 12px; bottom: 12px; height: 14px;
    border: 2px solid var(--edge); border-radius: 999px; background: #0a1820; z-index: 2;
    overflow: hidden;
  }
  #worldFx .loot-meter .fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #ffd56a, #ff3db8 55%, #3dfff0);
    box-shadow: 0 0 12px rgba(255,61,184,.6);
    transition: width .08s linear;
  }
  @keyframes tapPulse { 50% { transform: scale(1.06); filter: brightness(1.15); } }
  @keyframes fxIn { from { transform: translate(-50%, -50%) scale(.72); } to { transform: translate(-50%, -50%) scale(1); } }
  .quiz-sheet {
    flex: 0 0 auto;
    /* ~30% sheet → ~70% sea visible during gameplay (LOCKED direction) */
    max-height: 30vh;
    background: linear-gradient(180deg, #164556 0%, var(--sheet-2) 100%);
    border-top: 3px solid var(--edge);
    box-shadow: 0 -14px 32px rgba(0,0,0,.5);
    padding: 8px 10px max(10px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 6px;
    overflow: auto;
  }
  #main { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .chest-timer { width: 46px; height: 46px; position: relative; filter: drop-shadow(0 3px 8px rgba(0,0,0,.35)); }
  .chest-timer img { width: 100%; height: 100%; object-fit: contain; }
  .chest-timer .sec {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: var(--display); font-size: .95rem; color: #fff; text-shadow: 0 2px 4px #000;
  }
  .ribbon { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
  .ribbon::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; display: flex; align-items: center; gap: 5px;
    padding: 3px 8px 3px 3px; background: #123a4a; border: 2px solid var(--edge);
    border-radius: 999px; font-size: .72rem; font-weight: 900;
  }
  .chip img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
  .chip.you { border-color: var(--gold); }
  #subtitle { display: none; }
  .banner {
    background: linear-gradient(180deg, #18485a 0%, #0f3342 100%);
    border: 2px solid var(--edge);
    border-radius: 14px;
    padding: 10px 12px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
  }
  .banner .tag, .quiz-sheet > .tag {
    display: inline-block; margin-bottom: 3px; padding: 2px 7px; border-radius: 999px;
    background: #3a2a10; color: var(--gold);
    font-size: .62rem; font-weight: 900; letter-spacing: .07em; text-transform: uppercase;
  }
  .banner h2 {
    margin: 0; font-size: clamp(.98rem, 3.8vw, 1.15rem); line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .banner .muted { margin: 4px 0 0; opacity: .88; font-size: .76rem; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .choice {
    border: 3px solid #2f7a8e; border-radius: 14px;
    background: linear-gradient(180deg, #226274 0%, var(--choice) 100%);
    color: var(--cream); padding: 9px; cursor: pointer; text-align: left;
    display: grid; grid-template-columns: 44px 1fr auto; gap: 7px; align-items: center;
    min-height: 58px; transition: transform .08s ease, background .12s ease, border-color .12s ease;
    box-shadow: 0 4px 0 #0a2a34;
  }
  .choice img { width: 44px; height: 44px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,.35)); }
  .choice strong { display: block; color: var(--gold); font-size: .88rem; }
  .choice span { display: block; font-size: .74rem; line-height: 1.15; }
  .choice .amt { font-family: var(--display); font-size: 1rem; color: var(--gold); text-align: center; min-width: 28px; }
  .alloc-btns { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .alloc-btn {
    width: 32px; height: 28px; border-radius: 8px; border: 2px solid var(--edge);
    background: linear-gradient(180deg, #ffe08a, #e8a820); color: #1a1008;
    font-family: var(--display); font-size: 1.1rem; font-weight: 900; cursor: pointer;
    box-shadow: 0 2px 0 #9a6a10;
  }
  .alloc-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 0 0 #9a6a10; }
  .alloc-btn:disabled { filter: grayscale(.5); opacity: .55; }
  .choice:active:not(:disabled) { transform: scale(.97); background: var(--choice-hi); }
  .choice:disabled { filter: none; opacity: 1; }
  .choice.picked { border-color: var(--gold); background: #2a5f4a; }
  .choice.correct { border-color: var(--ok); background: #1f5a40; }
  .choice.wrong { border-color: var(--bad); background: #5a2a28; }
  .choice.dim { opacity: .45; }
  .big {
    width: 100%; border: 0; cursor: pointer; padding: 12px 14px; border-radius: 14px;
    font-family: var(--display); font-size: 1.1rem; color: var(--ink);
    background: linear-gradient(180deg, #ffe08a, #e8a820);
    box-shadow: 0 5px 0 #9a6a10, 0 10px 18px rgba(0,0,0,.3);
  }
  .big:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 #9a6a10; }
  .big:disabled { filter: grayscale(.4) brightness(.85); }
  .big.pulse { animation: pulse 1.15s ease-in-out infinite; }
  @keyframes pulse { 50% { filter: brightness(1.12); } }
  .ghost {
    border: 2px solid var(--edge); background: rgba(255,255,255,.08);
    color: var(--cream); border-radius: 12px; padding: 10px 12px;
    font: inherit; font-weight: 900; cursor: pointer; width: 100%;
  }
  .invite { display: flex; gap: 6px; }
  .invite input {
    flex: 1; min-width: 0; border-radius: 10px; border: 2px solid var(--edge);
    background: rgba(0,0,0,.35); color: var(--cream); padding: 8px; font-size: .72rem;
  }
  .loot-bar { display: flex; justify-content: space-between; align-items: center; font-size: .8rem; margin: 4px 0 6px; }
  .loot-bar img { width: 22px; height: 22px; vertical-align: middle; }
  #toast {
    position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(140%); z-index: 30;
    background: rgba(20,10,5,.94); border: 2px solid var(--bad);
    color: #fff; padding: 10px 14px; border-radius: 12px; font-weight: 900;
    transition: transform .22s ease; pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #err { min-height: .9em; color: var(--bad); font-size: .78rem; font-weight: 900; }
  .center { text-align: center; }
  .hero-art { width: min(180px, 55%); height: auto; margin: 4px auto; display: block; filter: drop-shadow(0 8px 16px rgba(0,0,0,.4)); }
  .nick-modal {
    position: fixed; inset: 0; z-index: 40; display: grid; place-items: end center;
    background: radial-gradient(circle at 50% 18%, rgba(40,110,130,.5), rgba(5,18,28,.94));
    padding: 14px;
  }
  .nick-modal.hidden { display: none; }
  .nick-modal .banner, .nick-modal .quiz-sheet {
    width: min(420px, 100%); margin-bottom: 6vh;
    max-height: none; border-radius: 16px; border: 2px solid var(--edge);
  }
  .nick-modal input {
    width: 100%; margin: 8px 0 10px; border-radius: 12px; border: 2px solid var(--edge);
    background: rgba(0,0,0,.35); color: var(--cream); padding: 12px; font: inherit; text-align: center;
  }
  .casino-flash {
    position: fixed; inset: 0; pointer-events: none; z-index: 15;
    background: radial-gradient(circle at 50% 40%, rgba(255,0,200,.18), transparent 55%),
                radial-gradient(circle at 30% 70%, rgba(0,255,255,.12), transparent 45%);
    opacity: 0; transition: opacity .3s ease;
  }
  .casino-flash.on { opacity: 1; }
  /* Full-screen opaque Poseidon VIDEO — never a ghost overlay on the sea */
  #spectacle {
    position: fixed; inset: 0; z-index: 50; display: none;
    background: #041018; flex-direction: column;
  }
  #spectacle.on { display: flex; }
  #spectacle .cs-frame,
  #spectacle video.cs-video {
    flex: 1; min-height: 0; width: 100%; object-fit: cover;
    background: #041018; display: block;
  }
  #spectacle .cs-summary {
    display: none; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 50% 35%, rgba(255,61,184,.35), transparent 45%),
      radial-gradient(circle at 20% 70%, rgba(61,255,240,.28), transparent 40%),
      radial-gradient(circle at 80% 60%, rgba(255,213,106,.3), transparent 40%),
      linear-gradient(180deg, #1a0840 0%, #041018 100%);
    flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 18px max(24px, env(safe-area-inset-bottom));
    text-align: center; gap: 8px;
    overflow: hidden;
  }
  #spectacle .cs-summary.on { display: flex; animation: sumPop .4s cubic-bezier(.2,1.4,.4,1); }
  @keyframes sumPop { from { transform: scale(.9); filter: brightness(1.4); } to { transform: scale(1); } }
  #spectacle .cs-summary .coin-rain {
    position: absolute; inset: 0; pointer-events: none; overflow: hidden;
  }
  #spectacle .cs-summary .coin-rain i {
    position: absolute; top: -10%; font-style: normal;
    color: #ffd56a; font-size: 1.2rem;
    animation: coinFall linear forwards;
    text-shadow: 0 0 8px #ff3db8;
  }
  @keyframes coinFall {
    to { transform: translateY(120vh) rotate(420deg); opacity: 0.2; }
  }
  #spectacle .cs-summary .tag {
    display: inline-block; padding: 4px 10px; border-radius: 999px;
    background: #3a2a10; color: var(--gold);
    font-size: .7rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase;
  }
  #spectacle .cs-summary h2 {
    margin: 0; font-size: clamp(1.4rem, 6vw, 2rem); color: var(--gold);
    text-shadow: 0 3px 0 #1a0e04;
  }
  #spectacle .cs-summary .gold-line {
    font-family: var(--display); font-size: clamp(2.4rem, 12vw, 4rem);
    color: #fff6e4; margin: 6px 0;
    text-shadow: 0 0 24px #ff3db8, 0 4px 0 #1a0e04;
    animation: goldPulse 0.7s ease-in-out infinite;
  }
  #spectacle .cs-summary .gold-line b { color: var(--gold); }
  @keyframes goldPulse { 50% { transform: scale(1.06); filter: brightness(1.2); } }
  #spectacle .cs-summary .spent-line {
    font-family: var(--display); font-size: clamp(1rem, 4.5vw, 1.35rem);
    color: #3dfff0; margin: 0;
    text-shadow: 0 0 12px rgba(61,255,240,.55);
  }
  #spectacle .cs-summary p { margin: 0; opacity: .9; font-size: .95rem; max-width: 28rem; }
  #spectacle .cs-summary .score-fly {
    position: absolute; font-family: var(--display); font-size: 1.4rem;
    color: #ffd56a; pointer-events: none; z-index: 2;
    text-shadow: 0 0 10px #ff3db8; animation: scoreFly 1.1s ease-out forwards;
  }
  @keyframes scoreFly {
    0% { transform: translate(-50%, 0) scale(1.2); opacity: 1; }
    100% { transform: translate(-50%, -120px) scale(.7); opacity: 0; }
  }
  .pop { animation: pop .3s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform: scale(.94); } to { transform: scale(1); } }
  .scoreboard {
    display: flex; flex-direction: column; gap: 8px;
  }
  .score-row {
    display: grid; grid-template-columns: 36px 40px 1fr auto; gap: 8px; align-items: center;
    padding: 8px 10px; border-radius: 14px; border: 3px solid #2f7a8e;
    background: linear-gradient(180deg, #226274, #1a4d5e);
    box-shadow: 0 4px 0 #0a2a34;
    transform: translateX(0);
  }
  .score-row.you { border-color: var(--gold); background: linear-gradient(180deg, #2a6a4a, #1f4a38); }
  .score-row.overtake { animation: overtakeFlash .9s ease; border-color: #ff3db8; }
  .score-row img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
  .score-row .rank {
    font-family: var(--display); font-size: 1.1rem; color: var(--gold); text-align: center;
  }
  .score-row .delta { color: var(--ok); font-weight: 900; font-size: .85rem; }
  .score-row .delta.neg { color: var(--bad); }
  .score-row .pts { font-family: var(--display); font-size: 1.15rem; color: var(--gold); }
  @keyframes overtakeFlash {
    0% { transform: translateY(18px) scale(.96); filter: brightness(1.4); }
    35% { transform: translateY(-6px) scale(1.04); }
    100% { transform: translateY(0) scale(1); }
  }
  .hand {
    position: absolute; right: 16%; bottom: 34%; width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255,213,106,.22); border: 2px solid var(--gold);
    animation: hand 1.2s ease-in-out infinite; pointer-events: none; z-index: 5;
  }
  @keyframes hand { 50% { transform: translate(-8px,-12px) scale(1.08); } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="sea"></canvas>
  <div class="casino-flash" id="casino"></div>
  <div id="spectacle" aria-live="polite">
    <video class="cs-video" id="csVideo" playsinline muted></video>
    <div class="cs-summary" id="csSummary">
      <div class="tag" id="csTag">Wildcard</div>
      <h2 class="display" id="csTitle">Poseidon’s Rescue!</h2>
      <div class="gold-line" id="csGold"></div>
      <p id="csBody"></p>
    </div>
  </div>
  <div id="hud">
    <div class="top-chrome">
      <div class="ribbon" id="ribbon"></div>
      <div class="chest-timer" id="chestWrap">
        <img id="chestImg" src="./assets/chest-full.png" alt="">
        <div class="sec" id="chestSec">–</div>
      </div>
    </div>
    <div class="world-space" id="worldSpace">
      <div id="worldFx">
        <div class="fx-label" id="fxLabel">Tap to spin</div>
        <div class="slot-reels" id="slotReels" aria-hidden="true">
          <span>7</span><span>★</span><span>$</span>
        </div>
        <img id="fxChest" class="fx-chest" src="./assets/chest-closed.png" alt="">
        <canvas id="fxBurst" class="fx-burst"></canvas>
        <div class="tap-hint" id="tapHint">TAP!</div>
        <div class="loot-meter"><div class="fill" id="lootFill"></div></div>
      </div>
    </div>
    <div class="quiz-sheet">
      <div id="main"></div>
    </div>
    <p id="subtitle"></p>
    <div id="err" style="position:absolute;left:8px;right:8px;bottom:48%;pointer-events:none"></div>
  </div>
</div>
<div id="toast"></div>
<div class="nick-modal" id="nickModal">
  <div class="quiz-sheet center" style="border-radius:16px;border:2px solid var(--edge)">
    <div class="tag" style="align-self:center">Mobile voyage</div>
    <h2 class="display">Name your pirate</h2>
    <p class="muted">Play vs bot or invite friends.</p>
    <input id="nickInput" maxlength="12" placeholder="Cap’n Spark" autocomplete="nickname">
    <button class="big pulse" id="nickBot">PLAY VS BOT</button>
    <button class="ghost" id="nickGo" style="margin-top:8px">INVITE FRIENDS</button>
  </div>
</div>
<script src="./assets/voyage-v2/lanes.js"></script>
<script>
(() => {
  const LETTERS = ["A","B","C","D"];
  const ISLAND_FALLBACK = ["./assets/island-a.png","./assets/island-b.png","./assets/island-c.png","./assets/island-d.png"];
  const SHIP = ["./assets/ship-0.png","./assets/ship-1.png","./assets/ship-2.png","./assets/ship-3.png"];
  const PORTRAIT = ["./assets/portrait-0.png","./assets/portrait-1.png","./assets/portrait-2.png","./assets/portrait-3.png"];
  /** Island-specific loot videos play on the quiz sea when a ship arrives. */
  const LOOT_VID = [
    "./assets/video/loot-a.mp4",
    "./assets/video/loot-b.mp4",
    "./assets/video/loot-c.mp4",
    "./assets/video/loot-d.mp4",
  ];
  const POSEIDON_VID = "./assets/video/poseidon.mp4";
  const LOOT_STILL = ["./assets/cs-plunder-1.jpg", "./assets/cs-plunder-2.jpg"];
  const POSEIDON_STILL = ["./assets/cs-poseidon-1.jpg", "./assets/cs-poseidon-2.jpg", "./assets/cs-poseidon-3.jpg"];

  /**
   * Voyage v2 (LOCKED): 10 unique baked-island seas + authored water lanes.
   * Islands live in the backdrop — never muddy cutout composites on the voyage.
   * Ships follow VOYAGE_LANES polylines only (Coin Master clarity / Clash Royale arcs).
   */
  const COMMIT_TRAVEL_S = 1.1;
  const EXIT_TRAVEL_S = 2.0;
  const ENTER_TRAVEL_S = 1.0;
  const SHIP_SCREEN_FRAC = 0.09; // 8–10% screen width
  const NAME_MAX = 12;

  function buildScenesFromLanes(lanes) {
    return (lanes || []).map((s, i) => ({
      id: s.id || ("S" + String(i).padStart(2, "0")),
      bg: s.bg || (`./assets/voyage-v2/bg-S${String(i).padStart(2, "0")}.jpg`),

    sctx.restore();

    fxParticles = fxParticles.filter((p) => {
      const age = now - p.t0;
      if (age > p.life) return false;
      p.x += p.vx; p.y += p.vy; p.vy += 0.06;
      const a = 1 - age / p.life;
      if (a < 0.12) return true;
      const im = p.kind === "coin" ? (imgLootTrail || imgCoinBurst) : imgSparkle;
      drawImg(im, p.x, p.y, 26 + 14 * a);
      return true;
    });

    flyCoins = flyCoins.filter((c) => {
      const age = (now - c.t0) / c.dur;
      if (age >= 1 || age < 0) return age < 1;
      const e = 1 - Math.pow(1 - age, 2.4);
      const x = c.x0 + (c.x1 - c.x0) * e;
      const y = c.y0 + (c.y1 - c.y0) * e - Math.sin(age * Math.PI) * 40;
      drawImg(imgLootTrail || imgCoinBurst, x, y, 34);
      return true;
    });

    if (cutscene && cutscene.stage === "world") {
      const u = (now - cutscene.t0) / cutscene.animMs;
      if (u >= 1) endCutscene();
      else drawWorldCutscene(now, u, W, H);
    }

    sctx.restore();
  }

  function launchLootFlies(islandIdx) {
    const W = innerWidth, H = innerHeight;
    const from = islandPos(islandIdx, W, H);
    const players = (lastState && lastState.view && lastState.view.players) || [];
    const mySeat = players.findIndex((p) => p.id === (lastState && lastState.you));
    const to = fleetPos(mySeat >= 0 ? mySeat : 0, Math.max(2, players.length), W, H);
    for (let i = 0; i < 10; i++) {
      flyCoins.push({
        x0: from.x + (Math.random() - 0.5) * 30,
        y0: from.y + (Math.random() - 0.5) * 20,
        x1: to.x + (Math.random() - 0.5) * 24,
        y1: to.y,
        t0: performance.now() + i * 55,
        dur: 700 + Math.random() * 280,
      });
    }
  }

  function drawWorldCutscene(now, u, W, H) {
    const sh = seaH(H);
    if (cutscene.kind === "crash") {
      const isl = cutscene.meta.island ?? 0;
      const p = islandPos(isl, W, H);
      drawImg(imgCrash, p.x + 30, p.y + 20, 110);
      if (u < 0.85) drawImg(imgImpact, p.x + 30, p.y + 10, 90);
      shakeUntil = now + 80;
    } else if (cutscene.kind === "shark") {
      const x = W * (0.1 + 0.8 * u);
      drawImg(sharkImg, x, sh * 0.72, 110);
      drawImg(imgSplash, x, sh * 0.8, 90);
    }
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function frame(now) {
    requestAnimationFrame(frame);
    tickCutscene(now);
    tickIslandLoot(now);
    drawSea(now);
    lastFrameAt = now;
    if (lastState && lastState.view) tickClock(lastState.view);
    else tickClock(null);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
  }

  function renderRibbon(v, you) {
    if (!v) { ribbonEl.innerHTML = ""; return; }
    ribbonEl.innerHTML = v.players.map((p, i) => {
      const isYou = p.id === you;
      return `<div class="chip${isYou ? " you" : ""}"><img src="${PORTRAIT[i % 4]}" alt=""><span>${esc(p.nick)} · ${p.score}</span></div>`;
    }).join("");
  }

  function syncShips(s, v) {
    const players = v.players || [];
    const iAnswered = !!(v.you && v.you.answered);
    // Keep scene index in sync (except mid travel fade)
    if (v.sceneKind === "voyage" && v.phase !== "scene_travel" && v.sceneIndex != null) {
      if (!travelFx) activeSceneIdx = v.sceneIndex % SCENES.length;
    }
    players.forEach((p, seat) => {
      if (v.phase === "question") {
        if (p.id === s.you) chosenIsland[seat] = v.you.answerIndex;
        else if (iAnswered && p.answered) chosenIsland[seat] = -1;
        else chosenIsland[seat] = null;
      } else if (v.phase === "q_reveal" && v.reveal && v.reveal.results) {
        const r = v.reveal.results[p.id];
        chosenIsland[seat] = r && r.index != null ? r.index : null;
      } else if (v.phase === "loot" || v.phase === "loot_intro" || v.phase === "loot_reveal" || v.phase === "loot_wildcard" || v.phase === "scene_travel") {
        chosenIsland[seat] = null;
      } else if (v.phase === "scoreboard") {
        chosenIsland[seat] = null;
      } else {
        chosenIsland[seat] = null;
      }
    });
    syncLootFleet(s, v);
  }

  function renderQuestion(s, v) {
    const q = v.question, you = v.you;
    const can = s.status === "playing" && s.seats.includes(s.you) && v.phase === "question" && !you.answered;
    subtitleEl.textContent = `Q ${v.questionIndex + 1}/${v.questionTotal}`;

    pathPreview = you.answerIndex;
    mainEl.innerHTML = `<div class="banner pop">
      <div class="tag">Sail banner</div>

        pathPreview = i;

          st.commitJuiceUntil = performance.now() + 100;
        }
        hitStopUntil = performance.now() + 55;
        try { if (navigator.vibrate) navigator.vibrate(12); } catch (_) {}

        act({ type: "answer", index: i });

  function renderScoreboard(s, v) {
    syncShips(s, v);
    pathPreview = null;
    subtitleEl.textContent = "Standings";
    const ranking = v.ranking || (v.players || []).map((p) => p.id);
    const results = v.reveal && v.reveal.results ? v.reveal.results : {};
    const rows = ranking.map((id, rank) => {
      const p = (v.players || []).find((x) => x.id === id) || { nick: "?", score: 0 };
      const seat = (v.players || []).findIndex((x) => x.id === id);
      const delta = results[id] ? (results[id].delta || 0) : 0;
      const prev = prevRankOrder.indexOf(id);
      const overtake = prev >= 0 && prev > rank;
      const isYou = id === s.you;
      return `<div class="score-row${isYou ? " you" : ""}${overtake ? " overtake" : ""}">
        <div class="rank">${rank + 1}</div>
        <img src="${PORTRAIT[(seat >= 0 ? seat : rank) % 4]}" alt="">
        <div><strong>${esc(p.nick)}</strong>${delta ? `<div class="delta${delta < 0 ? " neg" : ""}">${delta > 0 ? "+" : ""}${delta}</div>` : ""}</div>
        <div class="pts">${p.score}</div>
      </div>`;

      <div class="tag">Leaderboard</div>
      <h2 class="display">Standings</h2>

  function renderLoot(s, v) {
    pathPreview = null;
    lootFleet = [];
    syncShips(s, v);
    subtitleEl.textContent = `Below deck · ${youPoolLabel(v)}`;
    const you = v.you;
    const can = s.status === "playing" && s.seats.includes(s.you) && !you.locked;
    const q = v.question;
    const step = v.step || 10;
    const left = you.lootLeft != null ? you.lootLeft : Math.max(0, (you.lootPool || 0) - Object.values(you.allocation || {}).reduce((a, b) => a + b, 0));
    const spent = (you.lootPool || 0) - left;
    mainEl.innerHTML = `<div class="banner pop">
      <div class="tag">Captain’s table</div>
      <h2 class="display">${esc((q && q.text) || "Split your gold")}</h2>
      <p class="muted">${you.locked ? "Locked — waiting…" : `Left <b>${left}</b> · Staked <b>${spent}</b>`}</p>
    </div>
    <div class="choices" id="choices"></div>
    <button class="big${can && spent > 0 ? " pulse" : ""}" id="lockBtn" ${can && spent > 0 ? "" : "disabled"}>
      <img src="./assets/wheel.png" alt="" style="width:24px;height:24px;vertical-align:middle;margin-right:6px">${you.locked ? "LOCKED!" : "TURN THE WHEEL"}
    </button>`;
    const root = document.getElementById("choices");
    (q && q.answers ? q.answers : ["A","B","C","D"]).forEach((label, i) => {
      const ven = v.ventures[i];
      const amt = you.allocation[ven.id] || 0;
      const el = document.createElement("div");
      el.className = "choice" + (amt > 0 ? " picked" : "");
      el.style.cursor = "default";
      el.innerHTML = `<img src="${islandChoiceSrc(i)}" alt=""><div><strong>${LETTERS[i]}</strong><span>${esc(label)}</span></div>
        <div class="alloc-btns">
          <button type="button" class="alloc-btn" data-d="-1" ${!can || amt <= 0 ? "disabled" : ""}>−</button>
          <div class="amt">${amt}</div>
          <button type="button" class="alloc-btn" data-d="1" ${!can || left < step ? "disabled" : ""}>+</button>
        </div>`;
      el.querySelectorAll(".alloc-btn").forEach((btn) => {
        btn.onclick = (ev) => {
          ev.stopPropagation();
          if (!can) return;
          const d = Number(btn.getAttribute("data-d"));
          const next = Math.max(0, amt + d * step);
          const others = Object.entries(you.allocation || {}).reduce((a, [k, val]) => a + (k === ven.id ? 0 : (val || 0)), 0);
          if (others + next > (you.lootPool || 0)) { toast("No loot left!"); haptic([40, 30, 40]); return; }
          act({ type: "alloc", venture: ven.id, amount: next });
          if (v.you) {
            v.you.allocation = { ...(v.you.allocation || {}), [ven.id]: next };
            v.you.lootLeft = (v.you.lootPool || 0) - Object.values(v.you.allocation).reduce((a, b) => a + (b || 0), 0);
          }
          syncLootFleet(s, v);
          haptic(10);
          renderLoot(s, v);
        };
      });
      root.appendChild(el);
    });
    document.getElementById("lockBtn").onclick = () => {
      if (!can || spent <= 0) return;
      hitStopUntil = performance.now() + 70;
      casinoEl.classList.add("on");
      setTimeout(() => casinoEl.classList.remove("on"), 600);
      act({ type: "lock" });
    };
  }

  function render(s) {
    const v = s.view;
    renderRibbon(v, s.you);
    if (s.status === "waiting" || !v) { renderWaiting(s); return; }
    if (s.status === "over" || v.phase === "winner") { renderWinner(s, v); return; }
    if (v.phase === "lobby") renderLobby(s, v);
    else if (v.phase === "question") renderQuestion(s, v);

  async function boot() {
    bg = await loadImg("./assets/voyage-v2/bg-S00.jpg") || await loadImg("./assets/bg-sea.jpg");
    cloudsImg = await loadImg("./assets/clouds.png");
    reefImg = await loadImg("./assets/reef-rocks.png");
    fogImg = await loadImg("./assets/fog.png");
    sharkImg = await loadImg("./assets/shark.png");
    // 10 baked voyage seas (voyage-v2) + loot rooms
    sceneBgs = await Promise.all(SCENES.map((sc) => loadImg(sc.bg)));
    belowDeckBg = await loadImg(BELOW_DECK_BG);
    lootVoyageBg = await loadImg(LOOT_VOYAGE_BG);
    if (!sceneBgs[0]) sceneBgs[0] = bg;
    // Prefer voyage-v2 16-dir sheets; fall back to legacy ship sprites
    shipDirs = await Promise.all([0,1,2,3].map(async (i) => {
      const o = {};
      await Promise.all(DIR16.map(async (d) => {
        o[d] = await loadImg(`./assets/voyage-v2/ships/p${i}/${d}.png`)
          || await loadImg(`./assets/ship-${i}-${d}.png`);
      }));
      const legacy = ["e","ne","n","nw","w","sw","s","se"];
      await Promise.all(legacy.map(async (d) => {
        if (!o[d]) o[d] = await loadImg(`./assets/ship-${i}-${d}.png`);
      }));
      if (!o.e) o.e = await loadImg(SHIP[i]);
      // Fill any missing dirs from nearest available so facing never pops blank
      for (let di = 0; di < DIR16.length; di++) {
        if (o[DIR16[di]]) continue;
        for (let k = 1; k < 16; k++) {
          const a = o[DIR16[(di + k) % 16]] || o[DIR16[(di - k + 16) % 16]];
          if (a) { o[DIR16[di]] = a; break; }
        }
      }
      return o;
    }));
    shipIdle = await Promise.all([0,1,2,3].map(async (i) => (
      (await Promise.all([0,1,2,3,4,5].map((f) => loadImg(`./assets/voyage-v2/ships/p${i}/idle/idle-${f}.png`)))).filter(Boolean)
    )));
    shipCheer = await Promise.all([0,1,2,3].map(async (i) => (
      (await Promise.all([0,1,2,3].map((f) => loadImg(`./assets/voyage-v2/ships/p${i}/cheer/cheer-${f}.png`)))).filter(Boolean)
    )));
    shipSad = await Promise.all([0,1,2,3].map(async (i) => (
      (await Promise.all([0,1,2,3].map((f) => loadImg(`./assets/voyage-v2/ships/p${i}/sad/sad-${f}.png`)))).filter(Boolean)
    )));
    vfxGlow = (await Promise.all([0,1,2,3].map((i) => loadImg(`./assets/voyage-v2/vfx/glow/glow-${i}.png`)))).filter(Boolean);
    vfxFire = (await Promise.all([0,1,2,3].map((i) => loadImg(`./assets/voyage-v2/vfx/fireworks/fireworks-${i}.png`)))).filter(Boolean);
    birdFrames = (await Promise.all([0,1,2].map((i) => loadImg(`./assets/bird-f${i}.png`)))).filter(Boolean);
    const birdV2 = (await Promise.all([0,1,2,3,4,5].map((i) => loadImg(`./assets/voyage-v2/ambient/birds/birds-${i}.png`)))).filter(Boolean);
    if (birdV2.length) birdFrames = birdV2;
    islandImgs = await Promise.all(ISLAND_FALLBACK.map(loadImg));
    islandPack = await Promise.all(
      Array.from({ length: 16 }, (_, i) => loadImg(`./assets/islands-pack/isl-${String(i).padStart(2, "0")}.png`))
    );
    // Fill gaps with fallbacks so every scene island resolves
    for (let i = 0; i < 16; i++) {
      if (!islandPack[i]) islandPack[i] = islandImgs[i % 4];
    }
    await loadImg("./assets/chest-closed.png");
    await loadImg("./assets/chest-spin.png");
    await loadImg("./assets/chest-crack.png");
    await loadImg("./assets/chest-open-gold.png");
    // Preload videos so arrival loot starts instantly
    LOOT_VID.forEach((src) => { const v = document.createElement("video"); v.preload = "auto"; v.muted = true; v.src = src; });
    { const v = document.createElement("video"); v.preload = "auto"; v.muted = true; v.src = POSEIDON_VID; }
    imgCoinBurst = await loadImg("./assets/vfx-coin-burst.png");
    imgChestOpen = await loadImg("./assets/vfx-chest-open.png");
    imgSparkle = await loadImg("./assets/vfx-sparkle.png");
    imgImpact = await loadImg("./assets/vfx-impact.png");
    imgSplash = await loadImg("./assets/vfx-splash.png");
    imgWake = await loadImg("./assets/vfx-wake.png");
    imgCrash = await loadImg("./assets/vfx-reef-crash.png");
    imgConfetti = await loadImg("./assets/vfx-confetti.png");
    imgCheer = await loadImg("./assets/ship-cheer.png");
    imgPlunderCrew = await loadImg("./assets/plunder-crew.png");
    imgLootCascade = await loadImg("./assets/loot-cascade.png");
    imgLootTrail = await loadImg("./assets/loot-trail.png");
    imgLootHaul = await loadImg("./assets/loot-haul.png");
    imgLootBurst = await loadImg("./assets/loot-burst.png");
    void imgCheer;
    requestAnimationFrame(frame);

    // Local harness: ?chestTest=1 opens the slot chest immediately
    if (params.get("chestTest") === "1") {
      nickModal.classList.add("hidden");
      setTimeout(() => startIslandLootVideo(0), 350);
    }

    function start(vsBot) {
      const n = nickInput.value.trim() || nick;
      if (!n) { toast("Pick a nickname!"); return; }
      setIdentity(n);
      if (vsBot) enableBotMode();
      else {
        wantBot = false;
        sessionStorage.removeItem("tt-vs-bot");
        params.delete("bot");
        history.replaceState(null, "", location.pathname + "?" + params);
      }
      nickModal.classList.add("hidden");
      connect();
    }

    if (nick && playerId) {
      nickModal.classList.add("hidden");
      connect();
    } else {
      nickInput.value = nick || "";
      nickInput.focus();
      document.getElementById("nickBot").onclick = () => start(true);
      document.getElementById("nickGo").onclick = () => start(false);
      nickInput.addEventListener("keydown", (e) => { if (e.code === "Enter") start(true); });
    }
  }
  boot();
})();
</script>
</body>
</html>
